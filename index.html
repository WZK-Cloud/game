                if(aiState.strafeTimer>90){ aiState.strafeTimer = 0; aiState.strafeDir *= -1; }
                const perpX = -dy/dist, perpY = dx/dist;
                moveX += perpX*aiState.strafeDir*0.5;
                moveY += perpY*aiState.strafeDir*0.5;
            } else {
                const cx = WORLD_WIDTH/2-player.x, cy = WORLD_HEIGHT/2-player.y;
                const cl = Math.hypot(cx,cy)||1;
                moveX = cx/cl*0.5; moveY = cy/cl*0.5;
                if(closestEnemy) player.facing = Math.atan2(closestEnemy.y-player.y, closestEnemy.x-player.x);
            }
            newMode = 'kite';
        } else {
            if(target){
                const dx = target.x-player.x, dy = target.y-player.y;
                const dist = Math.hypot(dx,dy)||1;
                if(!killRange.length) player.facing = Math.atan2(dy,dx);
                const ideal = swordRange*0.75;
                if(dist>ideal*1.15){ moveX += dx/dist; moveY += dy/dist; }
                else if(dist<ideal*0.55){ moveX -= dx/dist*0.5; moveY -= dy/dist*0.5; }
                else {
                    aiState.strafeTimer++;
                    if(aiState.strafeTimer>90){ aiState.strafeTimer = 0; aiState.strafeDir *= -1; }
                    const perpX = -dy/dist, perpY = dx/dist;
                    moveX += perpX*aiState.strafeDir*0.7;
                    moveY += perpY*aiState.strafeDir*0.7;
                }
                newMode = 'hunt';
            } else {
                const cx = WORLD_WIDTH/2-player.x, cy = WORLD_HEIGHT/2-player.y;
                const cl = Math.hypot(cx,cy)||1;
                if(cl>100){ moveX = cx/cl*0.6; moveY = cy/cl*0.6; }
                newMode = 'roam';
            }
        }
        if(newMode!==aiState.displayMode){
            const urgent = (newMode==='flee' && dangerLevel>=2)||newMode==='attack'||newMode==='retreat';
            if(urgent || aiState.modeLockTimer<=0){ aiState.displayMode = newMode; aiState.modeLockTimer = 20; }
        } else { if(aiState.modeLockTimer>0) aiState.modeLockTimer--; }

        const margin = 150;
        if(player.x<margin) moveX += (margin-player.x)/margin*3;
        if(player.x>WORLD_WIDTH-margin) moveX -= (player.x-(WORLD_WIDTH-margin))/margin*3;
        if(player.y<margin) moveY += (margin-player.y)/margin*3;
        if(player.y>WORLD_HEIGHT-margin) moveY -= (player.y-(WORLD_HEIGHT-margin))/margin*3;

        if(aiState.positionHistory.length>=20){
            const oldest = aiState.positionHistory[0];
            const moved = Math.hypot(player.x-oldest.x, player.y-oldest.y);
            if(moved<5 && (moveX!==0||moveY!==0)){
                const ra = Math.random()*Math.PI*2;
                moveX = Math.cos(ra); moveY = Math.sin(ra);
                aiState.moveDir = {x:moveX, y:moveY};
            }
        }
        const dl = Math.hypot(moveX,moveY);
        if(dl>0.01){ moveX /= dl; moveY /= dl; }
        else { moveX = 0; moveY = 0; }
        const SMOOTH = 0.25;
        aiState.moveDir.x = aiState.moveDir.x*(1-SMOOTH)+moveX*SMOOTH;
        aiState.moveDir.y = aiState.moveDir.y*(1-SMOOTH)+moveY*SMOOTH;
        const sl = Math.hypot(aiState.moveDir.x, aiState.moveDir.y);
        if(sl>0.01){ aiState.moveDir.x /= sl; aiState.moveDir.y /= sl; }
        else { aiState.moveDir.x = 0; aiState.moveDir.y = 0; }

        const fl = Math.hypot(aiState.moveDir.x, aiState.moveDir.y);
        if(fl>0.01){
            let sm = 1.0;
            if(dangerLevel>=2) sm *= 1.25;
            if(isSwinging){
                if(swingAnim.phase==='windup'||swingAnim.phase==='anticipation') sm *= 0.4;
                else if(swingAnim.phase==='slash') sm *= 0.5;
                else sm *= 0.7;
            }
            const immortalSpeedMultAI = player.immortalActive ? 2 : 1;
            player.x += aiState.moveDir.x*PLAYER_SPEED*player.speedMultiplier*sm*immortalSpeedMultAI;
            player.y += aiState.moveDir.y*PLAYER_SPEED*player.speedMultiplier*sm*immortalSpeedMultAI;
        }
        player.x = Math.max(PLAYER_RADIUS, Math.min(WORLD_WIDTH-PLAYER_RADIUS, player.x));
        player.y = Math.max(PLAYER_RADIUS, Math.min(WORLD_HEIGHT-PLAYER_RADIUS, player.y));
        cameraTarget.x = player.x-w/2; cameraTarget.y = player.y-h/2;
        camera.x += (cameraTarget.x-camera.x)*0.2;
        camera.y += (cameraTarget.y-camera.y)*0.2;
        clampCamera();
    }

    function findSafestDirection(enemyInfos, testRadius){
        let bdx = 0, bdy = 0, bs = -Infinity;
        const sampleCount = 12;
        for(let i=0;i<sampleCount;i++){
            const ang = (i/sampleCount)*Math.PI*2;
            const tx = player.x+Math.cos(ang)*testRadius;
            const ty = player.y+Math.sin(ang)*testRadius;
            let threat = 0;
            for(const info of enemyInfos){
                const d = Math.hypot(info.predX-tx, info.predY-ty);
                if(d<220) threat += Math.pow((220-d)/220,2)*info.threat;
            }
            const m = 100;
            if(tx<m||tx>WORLD_WIDTH-m||ty<m||ty>WORLD_HEIGHT-m) threat += 5;
            const cd = Math.hypot(tx-WORLD_WIDTH/2, ty-WORLD_HEIGHT/2);
            threat += cd*0.001;
            if(-threat>bs){ bs = -threat; bdx = Math.cos(ang); bdy = Math.sin(ang); }
        }
        return {x:bdx, y:bdy};
    }

    // ========== 特效更新 ==========
    function updateVisualEffects(){
        if(screenShake.duration>0){
            screenShake.duration--;
            screenShake.intensity *= 0.9;
            if(screenShake.duration<=0) screenShake.intensity = 0;
        }
        if(bgPulse > 0) bgPulse -= 0.03;
        for(let i=particles.length-1;i>=0;i--){
            const p = particles[i];
            p.life--; p.x += p.vx; p.y += p.vy;
            p.vx *= 0.95; p.vy *= 0.95; p.vy += p.gravity;
            if(p.life<=0){ recycleParticle(p); particles.splice(i,1); }
        }
        for(let i=shockRings.length-1;i>=0;i--){
            const r = shockRings[i];
            r.life--;
            const t = 1-r.life/r.maxLife;
            r.radius = r.maxRadius*(1-Math.pow(1-t,2));
            if(r.life<=0) shockRings.splice(i,1);
        }
        for(let i=floatTexts.length-1;i>=0;i--){
            const ft = floatTexts[i];
            ft.life -= 0.03; ft.y += ft.vy; ft.vy *= 0.94;
            ft.scale = Math.min(1, ft.scale+ft.scaleSpeed);
            if(ft.life<=0) floatTexts.splice(i,1);
        }
        for(let i=energyPulses.length-1;i>=0;i--){
            const ep = energyPulses[i];
            ep.life--;
            const t = 1-ep.life/ep.maxLife;
            ep.radius = ep.maxRadius*(1-Math.pow(1-t,2));
            if(ep.life<=0) energyPulses.splice(i,1);
        }
        for(const ap of ambientParticles){
            ap.x += ap.vx; ap.y += ap.vy; ap.phase += 0.02;
            if(ap.y<-20){ ap.y = WORLD_HEIGHT+20; ap.x = Math.random()*WORLD_WIDTH; }
            if(ap.x<-20) ap.x = WORLD_WIDTH+20;
            if(ap.x>WORLD_WIDTH+20) ap.x = -20;
        }
        for(const nb of nebulas){
            nb.phase += nb.speed;
        }
        if(swingAnim.active){
            const transform = getSwordTransform();
            const tipX = player.x+Math.cos(transform.angle)*(PLAYER_RADIUS+swordRange*0.9);
            const tipY = player.y+Math.sin(transform.angle)*(PLAYER_RADIUS+swordRange*0.9);
            swordTrail.push({x:tipX, y:tipY, life:1.0, angle:transform.angle});
            if(swordTrail.length>MAX_SWORD_TRAIL) swordTrail.shift();
        }
        for(let i=swordTrail.length-1;i>=0;i--){
            swordTrail[i].life -= 0.09;
            if(swordTrail[i].life<=0) swordTrail.splice(i,1);
        }
    }

    function updateCooldownsAndEffects(){
        if(swordCooldown>0){ swordCooldown--; if(swordCooldown===0) updateSwordButtonState(); updateCooldownMask(); }
        updateSwingAnim();
        updateProjectiles();
        updateBoomerangs();
        updateBullets();
        if(player.isFlaming && player.weaponId === 'flamethrower'){
            if(player.flameFuel > 0){
                player.flameFuel -= 1.5;
                player.flameTick = (player.flameTick || 0) + 1;
                if(player.flameTick >= 3){ player.flameTick = 0; applyFlameDamage(); }
                if(frameCount % 8 === 0) AudioEngine.play('flame_loop');
                const ang = player.facing;
                for(let s=0; s<4; s++){
                    const spread = (Math.random()-0.5) * Math.PI * 0.5;
                    const a = ang + spread;
                    const spd = 8 + Math.random()*5;
                    const col = player.immortalActive ? [200, 160, 255] : [255, 120+Math.floor(Math.random()*100), 30];
                    spawnParticles(player.x + Math.cos(ang)*PLAYER_RADIUS, player.y + Math.sin(ang)*PLAYER_RADIUS,
                        1, col[0], col[1], col[2], spd, 6+Math.random()*5, 22, 0, 0.02);
                }
            } else {
                player.isFlaming = false;
                AudioEngine.play('fuel_empty');
            }
        }
        if(!player.isFlaming){ player.flameFuel = Math.min(player.flameMaxFuel, (player.flameFuel||0) + 0.4); }
        if(player.weaponId === 'flamethrower'){ fuelBadge.classList.add('show'); const pct = (player.flameFuel / player.flameMaxFuel) * 100; fuelFill.style.width = pct + '%'; }
        else { fuelBadge.classList.remove('show'); }
        for(let i=enemies.length-1; i>=0; i--){
            const e = enemies[i];
            if(e.burnTimer2 && e.burnTimer2 > 0){
                e.burnTimer2--;
                e.burnTick = (e.burnTick || 0) + 1;
                if(e.burnTick >= 60){
                    e.burnTick = 0;
                    e.health -= e.burnDamage2 || 1;
                    spawnParticles(e.x, e.y, 2, 255, 120, 40, 2, 2, 15, 0);
                    if(e.health <= 0){
                        enemyDeathExplosion(e);
                        enemies.splice(i,1);
                        kills++;
                        AudioEngine.play('kill_enemy');
                        player.exp += Math.floor(e.type.expValue * player.expMultiplier);
                        checkLevelUp();
                    }
                }
            }
        }
        for(let i=speedLines.length-1;i>=0;i--){
            const sl = speedLines[i];
            sl.life -= sl.decay;
            if(sl.life<=0){ recycleSpeedLine(sl); speedLines.splice(i,1); }
            else { sl.x += Math.cos(sl.angle)*2; sl.y += Math.sin(sl.angle)*2; sl.length *= 0.96; }
        }
        for(let i=damageNumbers.length-1;i>=0;i--){
            const dn = damageNumbers[i];
            dn.life -= dn.decay; dn.y += dn.vy;
            if(dn.life<=0){ recycleDamageNumber(dn); damageNumbers.splice(i,1); }
        }
    }

    function spawnLogic(){
        if(gameOver||isPaused) return;
        frameCount++;
        // 难度提升：刷新间隔缩短
        let spawnInterval = Math.max(15, ENEMY_SPAWN_INTERVAL-Math.floor(kills/5));
        if(frameCount%spawnInterval===0){
            let sc = 1;
            if(kills>20) sc = 2;
            if(kills>50) sc = 3;
            if(kills>80) sc = 4;
            for(let i=0;i<sc;i++){ if(enemies.length<MAX_ENEMIES) spawnEnemy(false); }
        }
    }

    // ========== 渲染 ==========
    let gridCanvas = null, gridPattern = null;
    function buildGridCache(){
        const GS = 200;
        gridCanvas = document.createElement('canvas');
        gridCanvas.width = GS; gridCanvas.height = GS;
        const g = gridCanvas.getContext('2d');
        g.strokeStyle = 'rgba(60,130,140,0.25)';
        g.lineWidth = 1;
        for(let i=0;i<=2;i++){
            const pos = i*100;
            g.beginPath(); g.moveTo(pos,0); g.lineTo(pos,GS); g.stroke();
            g.beginPath(); g.moveTo(0,pos); g.lineTo(GS,pos); g.stroke();
        }
        g.fillStyle = 'rgba(100,200,210,0.15)';
        for(let x=0;x<=2;x++) for(let y=0;y<=2;y++){
            g.beginPath(); g.arc(x*100, y*100, 2, 0, Math.PI*2); g.fill();
        }
        gridPattern = ctx.createPattern(gridCanvas, 'repeat');
    }

    function getSwordTransform(){
        if(!swingAnim.active){
            const breathe = Math.sin(frameCount*0.05)*0.03;
            return {angle:player.facing+0.25+breathe, pivotX:0, pivotY:0, scaleX:1, trailAlpha:0};
        }
        const ph = swingAnim.phase, fr = swingAnim.frame;
        if(ph==='windup'){
            const t = fr/WINDUP_FRAMES;
            const e = t*t*(3-2*t);
            const a = swingAnim.baseFacing+(swingAnim.windupAngle-swingAnim.baseFacing)*e;
            return {angle:a, pivotX:-Math.sin(a)*t*3, pivotY:Math.cos(a)*t*3, scaleX:1+t*0.05, trailAlpha:0};
        } else if(ph==='anticipation'){
            const t = fr/ANTICIPATION_FRAMES;
            const a = swingAnim.windupAngle-swingAnim.direction*t*0.15;
            return {angle:a, pivotX:-Math.sin(a)*3.5, pivotY:Math.cos(a)*3.5, scaleX:1.06, trailAlpha:0};
        } else if(ph==='slash'){
            const t = fr/SLASH_FRAMES;
            let e;
            if(t<0.4) e = (t/0.4)*(t/0.4)*0.3;
            else { const p = (t-0.4)/0.6; e = 0.3+0.7*(1-Math.pow(1-p,2)); }
            const s = swingAnim.slashStartAngle, en = swingAnim.slashEndAngle;
            const a = s+(en-s)*e;
            const st = 1+Math.sin(t*Math.PI)*0.12;
            return {angle:a, pivotX:-Math.sin(a)*Math.sin(t*Math.PI)*5, pivotY:Math.cos(a)*Math.sin(t*Math.PI)*5, scaleX:st, trailAlpha:1-t};
        } else {
            const t = fr/RECOVER_FRAMES;
            const e = t*t*(3-2*t);
            const se = swingAnim.slashEndAngle;
            const ta = player.facing+0.25;
            const a = se+(ta-se)*e;
            return {angle:a, pivotX:0, pivotY:0, scaleX:1, trailAlpha:0};
        }
    }

    function drawSword(sx, sy){
        const transform = getSwordTransform();
        player.swordAngle = transform.angle;
        const w = WEAPONS[player.weaponId];
        const style = w ? w.swingStyle : 'arc';
        const bladeLength = swordRange;
        const bladeWidth = w ? w.bladeWidth : 13;
        const handleLength = w ? w.handleLength : 12;
        const guardWidth = w ? w.guardWidth : 20;
        const bladeColor = player.immortalActive ? '#e0c0ff' : (w ? w.color : '#e0f4ff');

        if(transform.trailAlpha>0 && swingAnim.active && !w.isRanged){
            ctx.save();
            ctx.translate(sx+transform.pivotX, sy+transform.pivotY);
            const ba = swingAnim.baseFacing;
            const ha = swordArc/2;
            const ts = ba-ha;
            const ca = transform.angle;
            const tf = Math.min(ts,ca);
            const tt = Math.max(ts,ca);
            for(let l=0;l<5;l++){
                const la = transform.trailAlpha*(1-l*0.18)*0.5;
                const lw = 24-l*4;
                const r = PLAYER_RADIUS+bladeLength*(0.7+l*0.06);
                ctx.beginPath();
                ctx.arc(0,0,r,tf,tt);
                if(player.immortalActive) ctx.strokeStyle = `rgba(200,160,255,${la})`;
                else ctx.strokeStyle = `rgba(140,220,255,${la})`;
                ctx.lineWidth = lw;
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(0,0,PLAYER_RADIUS+bladeLength*0.8,tf,tt);
            if(player.immortalActive) ctx.strokeStyle = `rgba(255,220,255,${transform.trailAlpha*0.95})`;
            else ctx.strokeStyle = `rgba(255,255,255,${transform.trailAlpha*0.95})`;
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.restore();
        }

        ctx.save();
        ctx.translate(sx+transform.pivotX, sy+transform.pivotY);
        ctx.rotate(transform.angle);
        ctx.scale(transform.scaleX, 1);

        if(style==='thrust'){
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(-PLAYER_RADIUS-handleLength, -3, handleLength+bladeLength*0.7, 6);
            ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 1;
            ctx.strokeRect(-PLAYER_RADIUS-handleLength, -3, handleLength+bladeLength*0.7, 6);
            const tipX = -PLAYER_RADIUS+bladeLength;
            const tipStart = -PLAYER_RADIUS+bladeLength*0.7;
            ctx.fillStyle = player.immortalActive ? '#e0c0ff' : '#d0e8ff';
            ctx.beginPath();
            ctx.moveTo(tipStart, -bladeWidth);
            ctx.lineTo(tipX, 0);
            ctx.lineTo(tipStart, bladeWidth);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1; ctx.stroke();
        } else if(style==='smash'){
            ctx.fillStyle = '#4a2e1a';
            ctx.fillRect(-PLAYER_RADIUS-handleLength, -5, handleLength+6, 10);
            ctx.fillStyle = player.immortalActive ? '#c0a0e0' : '#a08060';
            ctx.fillRect(-PLAYER_RADIUS+4, -bladeWidth/2, bladeLength-12, bladeWidth);
            ctx.strokeStyle = player.immortalActive ? '#6040a0' : '#604020';
            ctx.lineWidth = 2;
            ctx.strokeRect(-PLAYER_RADIUS+4, -bladeWidth/2, bladeLength-12, bladeWidth);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
            for(let i=0;i<3;i++){
                const hx = -PLAYER_RADIUS+12+i*(bladeLength-20)/3;
                ctx.beginPath(); ctx.moveTo(hx,-bladeWidth/2+2); ctx.lineTo(hx,bladeWidth/2-2); ctx.stroke();
            }
        } else if(style==='dual'){
            ctx.save();
            ctx.translate(0,-4);
            drawSingleBlade(bladeLength, bladeWidth, handleLength, guardWidth, bladeColor, false);
            ctx.restore();
            ctx.save();
            ctx.translate(0,4); ctx.rotate(Math.PI);
            drawSingleBlade(bladeLength, bladeWidth, handleLength, guardWidth, bladeColor, false);
            ctx.restore();
        } else if(style==='boomerang'){
            ctx.save();
            ctx.rotate(Math.PI/4);
            ctx.fillStyle = player.immortalActive ? '#e0c0ff' : '#ffcc88';
            ctx.strokeStyle = player.immortalActive ? '#6040a0' : '#a06020';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-10,-10); ctx.lineTo(0,0); ctx.lineTo(10,-10);
            ctx.lineTo(7,-3); ctx.lineTo(0,7); ctx.lineTo(-7,-3);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
        } else if(style==='bat'){
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(-PLAYER_RADIUS-handleLength, -3, handleLength+8, 6);
            ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 1;
            ctx.strokeRect(-PLAYER_RADIUS-handleLength, -3, handleLength+8, 6);
            ctx.strokeStyle = '#2a1a0a';
            for(let i=0;i<5;i++){
                const hx = -PLAYER_RADIUS-handleLength+4+i*4;
                ctx.beginPath(); ctx.moveTo(hx,-3); ctx.lineTo(hx,3); ctx.stroke();
            }
            const batStart = -PLAYER_RADIUS+6;
            const batEnd = -PLAYER_RADIUS+bladeLength;
            const batMid = batStart + (batEnd-batStart)*0.55;
            ctx.fillStyle = player.immortalActive ? '#d0b0f0' : '#c8a060';
            ctx.beginPath();
            ctx.moveTo(batStart, -4);
            ctx.lineTo(batMid, -bladeWidth*0.55);
            ctx.quadraticCurveTo(batEnd-4, -bladeWidth*0.7, batEnd, -bladeWidth*0.5);
            ctx.quadraticCurveTo(batEnd+3, 0, batEnd, bladeWidth*0.5);
            ctx.quadraticCurveTo(batEnd-4, bladeWidth*0.7, batMid, bladeWidth*0.55);
            ctx.lineTo(batStart, 4);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#8a5a20'; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = 'rgba(255,240,200,0.5)'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(batStart+4, -2); ctx.lineTo(batMid, -bladeWidth*0.3);
            ctx.stroke();
            ctx.strokeStyle = player.immortalActive ? '#8040a0' : '#c04040';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(batEnd-3, 0, bladeWidth*0.4, -Math.PI*0.6, Math.PI*0.6);
            ctx.stroke();
        } else if(style==='flame'){
            ctx.fillStyle = player.immortalActive ? '#504060' : '#404850';
            ctx.fillRect(-PLAYER_RADIUS-handleLength, -5, handleLength+18, 10);
            ctx.strokeStyle = player.immortalActive ? '#302050' : '#202830';
            ctx.lineWidth = 1;
            ctx.strokeRect(-PLAYER_RADIUS-handleLength, -5, handleLength+18, 10);
            ctx.fillStyle = player.immortalActive ? '#e0c0ff' : '#ff8030';
            ctx.beginPath();
            ctx.arc(-PLAYER_RADIUS+16, 0, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = player.immortalActive ? '#8040a0' : '#802020';
            ctx.beginPath();
            ctx.arc(-PLAYER_RADIUS-8, 0, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = player.immortalActive ? '#402060' : '#401010';
            ctx.lineWidth = 2; ctx.stroke();
            if(player.isFlaming){
                if(player.immortalActive){
                    ctx.fillStyle = `rgba(200,160,255,0.8)`;
                } else {
                    ctx.fillStyle = `rgba(255,${150+Math.floor(Math.random()*100)},50,0.8)`;
                }
                ctx.beginPath();
                ctx.arc(-PLAYER_RADIUS+16, 0, 7, 0, Math.PI*2);
                ctx.fill();
            }
        } else if(style==='pistol'){
            ctx.fillStyle = player.immortalActive ? '#3a2a4a' : '#2a2a2a';
            ctx.fillRect(-PLAYER_RADIUS+4, -3, 24, 6);
            ctx.fillRect(-PLAYER_RADIUS-8, -5, 14, 10);
            ctx.save();
            ctx.translate(-PLAYER_RADIUS-6, 2);
            ctx.rotate(0.3);
            ctx.fillRect(0, 0, 8, 14);
            ctx.restore();
            ctx.strokeStyle = player.immortalActive ? '#c0a0e0' : '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-PLAYER_RADIUS+22, -3); ctx.lineTo(-PLAYER_RADIUS+24, -3); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-PLAYER_RADIUS+26, 0); ctx.lineTo(-PLAYER_RADIUS+30, 0); ctx.stroke();
        } else if(style==='bow'){
            ctx.strokeStyle = player.immortalActive ? '#a080c0' : '#8a5a20';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 16, -Math.PI*0.6, Math.PI*0.6, false);
            ctx.stroke();
            ctx.strokeStyle = player.immortalActive ? '#e0c0ff' : '#e0e0e0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(16*Math.cos(-Math.PI*0.6), 16*Math.sin(-Math.PI*0.6));
            ctx.lineTo(-4, 0);
            ctx.lineTo(16*Math.cos(Math.PI*0.6), 16*Math.sin(Math.PI*0.6));
            ctx.stroke();
            ctx.strokeStyle = player.immortalActive ? '#c0a0e0' : '#a0e080';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(20, 0); ctx.stroke();
            ctx.fillStyle = player.immortalActive ? '#c0a0e0' : '#a0e080';
            ctx.beginPath();
            ctx.moveTo(20, 0); ctx.lineTo(16, -3); ctx.lineTo(16, 3);
            ctx.closePath(); ctx.fill();
        } else {
            drawSingleBlade(bladeLength, bladeWidth, handleLength, guardWidth, bladeColor, true);
        }

        ctx.restore();
    }

    function drawSingleBlade(bladeLength, bladeWidth, handleLength, guardWidth, bladeColor, hasGuard){
        ctx.fillStyle = '#4a2e1a';
        ctx.fillRect(-PLAYER_RADIUS-handleLength, -4, handleLength+4, 8);
        ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 1;
        for(let i=0;i<3;i++){
            const hx = -PLAYER_RADIUS-handleLength+3+i*4;
            ctx.beginPath(); ctx.moveTo(hx,-4); ctx.lineTo(hx,4); ctx.stroke();
        }
        if(hasGuard){
            ctx.fillStyle = player.immortalActive ? '#b090d0' : '#b8944a';
            ctx.beginPath();
            if(ctx.roundRect) ctx.roundRect(-PLAYER_RADIUS-2, -guardWidth/2, 8, guardWidth, 3);
            else ctx.rect(-PLAYER_RADIUS-2, -guardWidth/2, 8, guardWidth);
            ctx.fill();
        }
        const bs = -PLAYER_RADIUS+6;
        const be = -PLAYER_RADIUS+bladeLength;
        ctx.strokeStyle = player.immortalActive ? 'rgba(200,160,255,0.7)' : 'rgba(140,220,255,0.5)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(bs,0); ctx.lineTo(be-5,0); ctx.stroke();
        ctx.fillStyle = bladeColor;
        ctx.beginPath();
        ctx.moveTo(bs, -bladeWidth/2);
        ctx.lineTo(be-10, -bladeWidth/2);
        ctx.lineTo(be, 0);
        ctx.lineTo(be-10, bladeWidth/2);
        ctx.lineTo(bs, bladeWidth/2);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(bs+2,0); ctx.lineTo(be-6,0); ctx.stroke();
    }

    function render(){
        const {w,h} = getLogicalSize();
        let shX = 0, shY = 0;
        if(screenShake.intensity>0.5){
            shX = (Math.random()-0.5)*screenShake.intensity;
            shY = (Math.random()-0.5)*screenShake.intensity;
        }
        ctx.save();
        ctx.translate(shX, shY);
        
        ctx.fillStyle = '#0a1418';
        ctx.fillRect(-20,-20,w+40,h+40);
        
        for(const nb of nebulas){
            const nx = nb.x - camera.x;
            const ny = nb.y - camera.y;
            if(nx > -nb.radius && nx < w+nb.radius && ny > -nb.radius && ny < h+nb.radius){
                const pulse = 0.6 + 0.4*Math.sin(nb.phase);
                const g = ctx.createRadialGradient(nx, ny, 0, nx, ny, nb.radius);
                g.addColorStop(0, `hsla(${nb.hue}, 60%, 50%, ${0.08*pulse})`);
                g.addColorStop(1, `hsla(${nb.hue}, 60%, 50%, 0)`);
                ctx.fillStyle = g;
                ctx.fillRect(nx-nb.radius, ny-nb.radius, nb.radius*2, nb.radius*2);
            }
        }
        
        if(gridPattern){
            ctx.save();
            ctx.translate(-camera.x%200, -camera.y%200);
            ctx.fillStyle = gridPattern;
            ctx.fillRect(0,0,w+200,h+200);
            ctx.restore();
        }
        ctx.strokeStyle = 'rgba(80,180,200,0.3)';
        ctx.lineWidth = 8;
        ctx.strokeRect(-camera.x, -camera.y, WORLD_WIDTH, WORLD_HEIGHT);
        ctx.strokeStyle = 'rgba(126,214,223,0.9)';
        ctx.lineWidth = 2;
        ctx.strokeRect(-camera.x, -camera.y, WORLD_WIDTH, WORLD_HEIGHT);

        for(const d of groundDecorations){
            const sx = d.x-camera.x, sy = d.y-camera.y;
            if(sx>-30 && sx<w+30 && sy>-30 && sy<h+30){
                const p = 0.5+0.5*Math.sin(frameCount*0.03+d.phase);
                if(d.type==='crystal'){
                    ctx.strokeStyle = `rgba(126,214,223,${0.15+p*0.15})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    const s = d.size;
                    ctx.moveTo(sx, sy-s); ctx.lineTo(sx+s*0.7, sy);
                    ctx.lineTo(sx, sy+s); ctx.lineTo(sx-s*0.7, sy);
                    ctx.closePath(); ctx.stroke();
                } else {
                    ctx.strokeStyle = `rgba(100,200,210,${0.1+p*0.12})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(sx,sy,d.size*1.5,0,Math.PI*2); ctx.stroke();
                }
            }
        }

        for(const ap of ambientParticles){
            const sx = ap.x-camera.x, sy = ap.y-camera.y;
            if(sx>-10 && sx<w+10 && sy>-10 && sy<h+10){
                const a = 0.15+0.15*Math.sin(ap.phase);
                ctx.fillStyle = ap.hue===180?`rgba(126,214,223,${a})`:`rgba(100,240,180,${a})`;
                ctx.beginPath(); ctx.arc(sx,sy,ap.size,0,Math.PI*2); ctx.fill();
            }
        }

        for(const sl of speedLines){
            const sx = sl.x-camera.x, sy = sl.y-camera.y;
            if(sx>-50 && sx<w+50 && sy>-50 && sy<h+50){
                const ex = sx+Math.cos(sl.angle)*sl.length;
                const ey = sy+Math.sin(sl.angle)*sl.length;
                ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey);
                ctx.strokeStyle = `rgba(${sl.r},${sl.g},${sl.b},${sl.life})`;
                ctx.lineWidth = sl.width*sl.life; ctx.stroke();
            }
        }

        for(let i=0;i<swordTrail.length;i++){
            const st = swordTrail[i];
            const sx = st.x-camera.x, sy = st.y-camera.y;
            if(sx>-50 && sx<w+50 && sy>-50 && sy<h+50){
                const a = st.life*0.6;
                if(player.immortalActive) ctx.fillStyle = `rgba(200,160,255,${a})`;
                else ctx.fillStyle = `rgba(180,240,255,${a})`;
                ctx.beginPath(); ctx.arc(sx,sy,5*st.life,0,Math.PI*2); ctx.fill();
            }
        }

        for(const exp of explosionQueue){
            if(exp.timer>0){
                const sx = exp.x-camera.x, sy = exp.y-camera.y;
                const t = 1-exp.timer/exp.maxTimer;
                const a = 0.4+0.4*Math.sin(frameCount*0.5);
                const ir = exp.type.explosionRadius*(0.5+t*0.5);
                ctx.strokeStyle = `rgba(255,100,255,${a})`;
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(sx,sy,exp.type.explosionRadius,0,Math.PI*2); ctx.stroke();
                ctx.strokeStyle = `rgba(255,150,255,${a*0.8})`;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(sx,sy,ir,0,Math.PI*2); ctx.stroke();
            }
        }

        for(const p of projectiles){
            const sx = p.x-camera.x, sy = p.y-camera.y;
            if(sx>-30 && sx<w+30 && sy>-30 && sy<h+30){
                const a = p.life/p.maxLife;
                const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, p.radius*3);
                g.addColorStop(0, `rgba(${p.r},${p.g},${p.b},${a})`);
                g.addColorStop(1, `rgba(${p.r},${p.g},${p.b},0)`);
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(sx,sy,p.radius*3,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = `rgba(255,255,255,${a})`;
                ctx.beginPath(); ctx.arc(sx,sy,p.radius*0.5,0,Math.PI*2); ctx.fill();
            }
        }

        for(const b of boomerangs){
            const sx = b.x-camera.x, sy = b.y-camera.y;
            if(sx>-50 && sx<w+50 && sy>-50 && sy<h+50){
                ctx.save();
                ctx.translate(sx,sy);
                ctx.rotate(b.rotation);
                ctx.shadowColor = player.immortalActive ? '#c090ff' : '#ffcc88';
                ctx.shadowBlur = 15;
                ctx.fillStyle = player.immortalActive ? '#e0c0ff' : '#ffcc88';
                ctx.strokeStyle = player.immortalActive ? '#6040a0' : '#a06020';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-12,-12); ctx.lineTo(0,0); ctx.lineTo(12,-12);
                ctx.lineTo(8,-4); ctx.lineTo(0,8); ctx.lineTo(-8,-4);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.restore();
            }
        }

        for(const b of bullets){
            const sx = b.x - camera.x, sy = b.y - camera.y;
            if(sx > -50 && sx < w + 50 && sy > -50 && sy < h + 50){
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(b.angle);
                if(b.type === 'arrow'){
                    ctx.shadowColor = '#a0e080';
                    ctx.shadowBlur = 10;
                    ctx.strokeStyle = player.immortalActive ? '#c0a0e0' : '#a0e080';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(10, 0); ctx.stroke();
                    ctx.fillStyle = player.immortalActive ? '#c0a0e0' : '#a0e080';
                    ctx.beginPath();
                    ctx.moveTo(10, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4);
                    ctx.closePath(); ctx.fill();
                } else if(b.type === 'bullet'){
                    ctx.shadowColor = '#ffd840';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#ffd840';
                    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,220,100,0.6)';
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(0, 0); ctx.stroke();
                }
                ctx.restore();
            }
        }

        for(const e of enemies){
            const sx = e.x-camera.x, sy = e.y-camera.y;
            if(sx>-80 && sx<w+80 && sy>-80 && sy<h+80){
                const type = e.type;
                const hr = e.health/e.maxHealth;
                const flash = e.hitFlash>0 && Math.floor(e.hitFlash/2)%2===0;
                const pulse = 0.85+0.15*Math.sin(frameCount*0.08+e.x*0.01);
                const pa = (type.phase && e.phaseActive)?type.phaseAlpha:1.0;
                let sc = 1;
                if(e.spawnTimer>0) sc = 0.5+0.5*(1-e.spawnTimer/25);
                if(e.spawnPulse > 0) sc *= 1 + e.spawnPulse * 0.3;
                const r = type.radius*sc*pulse;
                ctx.save();
                ctx.globalAlpha = pa;
                if(flash){
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
                } else {
                    const c = type.color;
                    if(e.weightClass==='heavy'){
                        ctx.strokeStyle = `rgba(245,200,66,${0.5+0.3*Math.sin(frameCount*0.1)})`;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([6,4]);
                        ctx.beginPath(); ctx.arc(sx,sy,r+10,0,Math.PI*2); ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    if(e.shield>0){
                        ctx.strokeStyle = `rgba(100,200,255,${0.5+0.3*Math.sin(frameCount*0.15)})`;
                        ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(sx,sy,r+6,0,Math.PI*2); ctx.stroke();
                    }
                    if(type.slowAura){
                        ctx.strokeStyle = `rgba(100,220,240,0.2)`; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(sx,sy,type.slowRadius,0,Math.PI*2); ctx.stroke();
                    }
                    if(type.burnAura){
                        ctx.strokeStyle = `rgba(255,120,40,0.25)`; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(sx,sy,type.burnRadius,0,Math.PI*2); ctx.stroke();
                    }
                    if(type.healer){
                        ctx.strokeStyle = `rgba(100,255,140,0.2)`; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(sx,sy,type.healRadius,0,Math.PI*2); ctx.stroke();
                    }
                    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.3+hr*0.2})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(sx,sy,r+3,0,Math.PI*2); ctx.stroke();
                    ctx.fillStyle = `rgb(${Math.floor(c.r*0.15)},${Math.floor(c.g*0.15)},${Math.floor(c.b*0.15)})`;
                    ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
                    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.6+hr*0.4})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(sx,sy,r*0.7,0,Math.PI*2); ctx.stroke();
                    const core = type.coreColor;
                    ctx.fillStyle = `rgb(${core.r},${core.g},${core.b})`;
                    ctx.beginPath(); ctx.arc(sx,sy,r*0.3,0,Math.PI*2); ctx.fill();
                    if(e.stunTimer && e.stunTimer>0){
                        ctx.strokeStyle = `rgba(255,255,100,0.8)`;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([3,3]);
                        ctx.beginPath(); ctx.arc(sx,sy,r+8,0,Math.PI*2); ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    if(e.burnTimer2 && e.burnTimer2 > 0){
                        ctx.strokeStyle = `rgba(255,120,40,0.7)`;
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(sx,sy,r+4,0,Math.PI*2); ctx.stroke();
                    }
                }
                if(hr<1 && e.spawnTimer<=0){
                    const bw = type.radius*2.5, bh = 3;
                    const bx = sx-bw/2, by = sy-e.radius-13;
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(bx-1,by-1,bw+2,bh+2);
                    const hc = hr>0.6?'#5ac85a':(hr>0.3?'#e8c84a':'#e85a5a');
                    ctx.fillStyle = hc;
                    ctx.fillRect(bx,by,bw*hr,bh);
                    if(e.maxShield>0){
                        const sr = e.shield/e.maxShield;
                        ctx.fillStyle = `rgba(100,200,255,${0.4+sr*0.4})`;
                        ctx.fillRect(bx,by-5,bw*sr,2);
                    }
                }
                ctx.restore();
            }
        }

        for(const p of particles){
            const sx = p.x-camera.x, sy = p.y-camera.y;
            if(sx>-20 && sx<w+20 && sy>-20 && sy<h+20){
                const a = p.life/p.maxLife;
                const s = p.size*a;
                ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
                if(p.shape===0){ ctx.beginPath(); ctx.arc(sx,sy,s,0,Math.PI*2); ctx.fill(); }
                else if(p.shape===1){ ctx.fillRect(sx-s,sy-s,s*2,s*2); }
                else {
                    ctx.beginPath();
                    ctx.moveTo(sx,sy-s); ctx.lineTo(sx+s,sy+s); ctx.lineTo(sx-s,sy+s);
                    ctx.closePath(); ctx.fill();
                }
            }
        }

        for(const ring of shockRings){
            const sx = ring.x-camera.x, sy = ring.y-camera.y;
            const a = ring.life/ring.maxLife;
            ctx.strokeStyle = `rgba(${ring.r},${ring.g},${ring.b},${a})`;
            ctx.lineWidth = ring.width*a;
            ctx.beginPath(); ctx.arc(sx,sy,ring.radius,0,Math.PI*2); ctx.stroke();
        }
        for(const ep of energyPulses){
            const sx = ep.x-camera.x, sy = ep.y-camera.y;
            const a = ep.life/ep.maxLife*0.5;
            ctx.strokeStyle = `rgba(${ep.r},${ep.g},${ep.b},${a})`;
            ctx.lineWidth = 2*a;
            ctx.beginPath(); ctx.arc(sx,sy,ep.radius,0,Math.PI*2); ctx.stroke();
        }

        const psx = player.x-camera.x, psy = player.y-camera.y;

        if(MJ_MODE.enabled){
            for(let i=0;i<MJ_MODE.trailHistory.length;i++){
                const t = MJ_MODE.trailHistory[i];
                const tx = t.x-camera.x, ty = t.y-camera.y;
                const a = t.life*0.35;
                ctx.save();
                ctx.globalAlpha = a;
                ctx.translate(tx,ty);
                ctx.rotate(t.facing+Math.PI/4);
                ctx.scale(t.tilt/35*0.3+0.9, 1);
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.ellipse(0,-PLAYER_RADIUS-6,PLAYER_RADIUS*0.9,3,0,0,Math.PI*2);
                ctx.fill();
                ctx.fillRect(-PLAYER_RADIUS*0.6,-PLAYER_RADIUS-14,PLAYER_RADIUS*1.2,9);
                ctx.restore();
            }
            for(const s of MJ_MODE.sparkles){
                const sx = s.x-camera.x, sy = s.y-camera.y;
                ctx.save();
                ctx.globalAlpha = s.life;
                ctx.fillStyle = s.color;
                ctx.shadowColor = s.color;
                ctx.shadowBlur = 15;
                const size = s.size*s.life;
                ctx.beginPath();
                ctx.moveTo(sx,sy-size*2); ctx.lineTo(sx+size*0.5,sy-size*0.5);
                ctx.lineTo(sx+size*2,sy); ctx.lineTo(sx+size*0.5,sy+size*0.5);
                ctx.lineTo(sx,sy+size*2); ctx.lineTo(sx-size*0.5,sy+size*0.5);
                ctx.lineTo(sx-size*2,sy); ctx.lineTo(sx-size*0.5,sy-size*0.5);
                ctx.closePath(); ctx.fill();
                ctx.restore();
            }
        }

        if(player.immortalActive){
            const a = 0.05 + 0.03*Math.sin(frameCount*0.15);
            ctx.fillStyle = `rgba(200,160,255,${a})`;
            ctx.fillRect(0,0,w,h);
        }

        let boX = 0, boY = 0;
        if(swingAnim.active && swingAnim.phase==='slash'){
            const t = swingAnim.frame/SLASH_FRAMES;
            const off = Math.sin(t*Math.PI)*4;
            boX = Math.cos(swingAnim.baseFacing)*off;
            boY = Math.sin(swingAnim.baseFacing)*off;
        }

        ctx.save();
        if(player.immortalActive) ctx.translate(psx, psy + Math.sin(frameCount*0.1)*3);
        else ctx.translate(psx+boX, psy+boY);
        const inv = player.invulnTimer>0;
        const ib = inv && Math.floor(player.invulnTimer/4)%2===0;

        if (player.immortalActive) {
            ctx.save();
            ctx.rotate(frameCount * 0.05);
            ctx.strokeStyle = `rgba(255,220,255,${0.7 + 0.3*Math.sin(frameCount*0.15)})`;
            ctx.lineWidth = 4;
            ctx.shadowColor = '#c090ff';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.ellipse(0, 0, 60, 20, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(0, 0, 45, 15, 0, Math.PI * 0.5, Math.PI * 1.5);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            const auraR = PLAYER_RADIUS + 60 + Math.sin(frameCount * 0.1) * 8;
            const auraGrad = ctx.createRadialGradient(0, 0, PLAYER_RADIUS, 0, 0, auraR);
            auraGrad.addColorStop(0, 'rgba(200,160,255,0.5)');
            auraGrad.addColorStop(0.5, 'rgba(200,160,255,0.15)');
            auraGrad.addColorStop(1, 'rgba(200,160,255,0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(0, 0, auraR, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(0, -PLAYER_RADIUS - 30);
            ctx.rotate(frameCount * 0.08);
            ctx.strokeStyle = `rgba(255,255,255,${0.8 + 0.2*Math.sin(frameCount*0.3)})`;
            ctx.lineWidth = 3;
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(-10, -10); ctx.lineTo(-10, 10);
            ctx.moveTo(-10, -10); ctx.lineTo(10, -10);
            ctx.moveTo(10, 10); ctx.lineTo(10, -10);
            ctx.moveTo(10, 10); ctx.lineTo(-10, 10);
            ctx.stroke();
            ctx.restore();
        }

        if(aiMode){
            let ac = 'rgba(126,214,160,0.6)';
            if(aiState.displayMode==='flee') ac = 'rgba(230,100,100,0.8)';
            else if(aiState.displayMode==='kite') ac = 'rgba(230,180,80,0.7)';
            else if(aiState.displayMode==='retreat') ac = 'rgba(180,140,255,0.7)';
            else if(aiState.displayMode==='attack') ac = 'rgba(255,220,120,0.8)';
            ctx.beginPath(); ctx.arc(0,0,PLAYER_RADIUS+6,0,Math.PI*2);
            ctx.strokeStyle = ac; ctx.lineWidth = 3; ctx.stroke();
        }

        const mjTilt = MJ_MODE.enabled ? MJ_MODE.tiltAngle*Math.PI/180 : 0;
        const mjSpin = MJ_MODE.enabled ? MJ_MODE.spinPhase : 0;
        if(MJ_MODE.enabled && mjSpin>0.01) ctx.rotate(mjSpin);
        if(MJ_MODE.enabled && mjTilt>0.01){
            const ma = Math.atan2(aiState.moveDir.y, aiState.moveDir.x);
            const pa2 = ma+Math.PI/2;
            const tX = Math.cos(pa2)*mjTilt*0.3;
            const tY = Math.sin(pa2)*mjTilt*0.3;
            ctx.transform(1,0,tX,1,0,tY);
        }

        const pp = 1+0.05*Math.sin(frameCount*0.1);
        if(player.immortalActive){
            ctx.strokeStyle = `rgba(200,160,255,${0.6+0.3*Math.sin(frameCount*0.15)})`;
            ctx.shadowColor = '#c090ff';
            ctx.shadowBlur = 20;
        } else if(inv){
            ctx.strokeStyle = 'rgba(255,200,100,0.8)';
        } else {
            ctx.strokeStyle = `rgba(126,214,223,${0.4+0.2*Math.sin(frameCount*0.08)})`;
        }
        ctx.lineWidth = inv||player.immortalActive?4:2;
        ctx.beginPath(); ctx.arc(0,0,PLAYER_RADIUS*pp+4,0,Math.PI*2); ctx.stroke();
        ctx.shadowBlur = 0;

        if(player.heavyBonus>0){
            ctx.strokeStyle = `rgba(245,200,66,${0.3+0.15*Math.sin(frameCount*0.1)})`;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0,0,PLAYER_RADIUS+10,0,Math.PI*2); ctx.stroke();
        }
        if(player.immortalActive){
            ctx.fillStyle = ib?'#ffccff':'#2a1a3a';
        } else if(MJ_MODE.enabled){
            ctx.fillStyle = ib?'#ffcc88':'#1a1a1a';
        } else {
            ctx.fillStyle = ib?'#ffcc88':'#0a2a30';
        }
        ctx.beginPath(); ctx.arc(0,0,PLAYER_RADIUS,0,Math.PI*2); ctx.fill();
        if(player.immortalActive){
            ctx.strokeStyle = inv?'#ffddff':'#e0c0ff';
        } else if(MJ_MODE.enabled){
            ctx.strokeStyle = inv?'#ffdd88':'#ffffff';
        } else {
            ctx.strokeStyle = inv?'#ffdd88':'#7ed6df';
        }
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0,0,PLAYER_RADIUS*0.7,0,Math.PI*2); ctx.stroke();
        if(player.immortalActive) ctx.fillStyle = '#ffffff';
        else if(MJ_MODE.enabled) ctx.fillStyle = '#ffffff';
        else ctx.fillStyle = inv?'#ffffff':'#b8f0f8';
        ctx.beginPath(); ctx.arc(0,0,PLAYER_RADIUS*0.3,0,Math.PI*2); ctx.fill();
        const ix = Math.cos(player.facing)*(PLAYER_RADIUS-4);
        const iy = Math.sin(player.facing)*(PLAYER_RADIUS-4);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ix,iy,3,0,Math.PI*2); ctx.fill();

        if(MJ_MODE.enabled){
            const hatY = -PLAYER_RADIUS-8;
            const ht = mjTilt*0.5;
            ctx.save();
            ctx.translate(0,hatY);
            ctx.rotate(ht);
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.ellipse(0,0,PLAYER_RADIUS*1.0,4,0,0,Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(-PLAYER_RADIUS*0.65,-14,PLAYER_RADIUS*1.3,14);
            ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
            ctx.strokeRect(-PLAYER_RADIUS*0.65,-14,PLAYER_RADIUS*1.3,14);
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(-PLAYER_RADIUS*0.65,-5,PLAYER_RADIUS*1.3,3);
            ctx.restore();
            const ga = player.facing;
            const gd = PLAYER_RADIUS+4;
            const lx = Math.cos(ga+Math.PI*0.6)*gd;
            const ly = Math.sin(ga+Math.PI*0.6)*gd;
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(lx,ly,4,0,Math.PI*2); ctx.fill();
            const rx = Math.cos(ga-Math.PI*0.6)*gd;
            const ry = Math.sin(ga-Math.PI*0.6)*gd;
            ctx.beginPath(); ctx.arc(rx,ry,4,0,Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }

        drawSword(0,0);
        ctx.restore();

        ctx.textAlign = 'center';
        for(const ft of floatTexts){
            const sx = ft.x-camera.x, sy = ft.y-camera.y;
            const a = Math.min(1, ft.life*2);
            ctx.save();
            ctx.translate(sx,sy);
            ctx.scale(ft.scale, ft.scale);
            ctx.font = `bold ${ft.size}px "Courier New", monospace`;
            ctx.shadowColor = `rgba(${ft.r},${ft.g},${ft.b},1)`;
            ctx.shadowBlur = 10;
            ctx.fillStyle = `rgba(${ft.r},${ft.g},${ft.b},${a})`;
            ctx.fillText(ft.text, 0, 0);
            ctx.restore();
        }
        for(const dn of damageNumbers){
            const sx = dn.x-camera.x, sy = dn.y-camera.y;
            if(sx>-50 && sx<w+50 && sy>-50 && sy<h+50){
                ctx.font = 'bold '+Math.floor(14+4*dn.life)+'px "Courier New", monospace';
                ctx.fillStyle = `rgba(${dn.r},${dn.g},${dn.b},${dn.life})`;
                ctx.fillText(dn.value, sx, sy);
            }
        }
        ctx.textAlign = 'left';
        ctx.restore();

        const vg = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.4, w/2, h/2, Math.max(w,h)*0.75);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = vg;
        ctx.fillRect(0,0,w,h);

        // 低血警示（血量≤2）
        if(player.health<=2 && !gameOver){
            const a = 0.15+Math.sin(frameCount*0.2)*0.12;
            ctx.fillStyle = `rgba(255,30,60,${a})`;
            ctx.fillRect(0,0,w,h);
            ctx.strokeStyle = `rgba(255,60,80,${a*2})`;
            ctx.lineWidth = 20;
            ctx.strokeRect(10,10,w-20,h-20);
        }
        
        if(bgPulse > 0){
            ctx.fillStyle = `rgba(255,220,255,${bgPulse * 0.4})`;
            ctx.fillRect(0,0,w,h);
        }

        if(gameOver){
            ctx.fillStyle = 'rgba(10,10,15,0.85)';
            ctx.fillRect(0,0,w,h);
            ctx.font = 'bold '+Math.min(54, w*0.1)+'px "Courier New", monospace';
            ctx.fillStyle = '#e66767';
            ctx.textAlign = 'center';
            ctx.fillText('你倒下了', w/2, h/2-40);
            ctx.font = Math.min(28, w*0.06)+'px "Courier New", monospace';
            ctx.fillStyle = '#f5e56b';
            ctx.fillText('击杀数: '+kills+'  |  等级: '+player.level, w/2, h/2+30);
            ctx.textAlign = 'left';
        }
    }

    // ========== 主循环 ==========
    function gameLoop(){
        if(!loopRunning) return;
        if(gameStarted){
            if(!gameOver && !isPaused && !achievementPanelOpen){
                handleInput();
                updateEnemies();
                processExplosionQueue();
                spawnLogic();
                updateCooldownsAndEffects();
                updateVisualEffects();
            } else if(isPaused && !achievementPanelOpen){
                updateVisualEffects();
            }
        }
        render();
        if(loopRunning) gameLoopId = requestAnimationFrame(gameLoop);
    }

    // ========== 键盘 ==========
    window.addEventListener('keydown', (e)=>{
        const key = e.key.toLowerCase();
        if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','space','j','r'].includes(key) || e.key===' ') e.preventDefault();
        const ks = window.keyState;
        if(key==='w') ks.w = true;
        if(key==='a') ks.a = true;
        if(key==='s') ks.s = true;
        if(key==='d') ks.d = true;
        if(e.key==='ArrowUp') ks.up = true;
        if(e.key==='ArrowDown') ks.down = true;
        if(e.key==='ArrowLeft') ks.left = true;
        if(e.key==='ArrowRight') ks.right = true;
        if(e.key===' '||e.key==='Space'||key==='j') trySwordAttack();
        if(key==='r') activateImmortal();
    });
    window.addEventListener('keyup', (e)=>{
        const key = e.key.toLowerCase();
        const ks = window.keyState;
        if(key==='w') ks.w = false;
        if(key==='a') ks.a = false;
        if(key==='s') ks.s = false;
        if(key==='d') ks.d = false;
        if(e.key==='ArrowUp') ks.up = false;
        if(e.key==='ArrowDown') ks.down = false;
        if(e.key==='ArrowLeft') ks.left = false;
        if(e.key==='ArrowRight') ks.right = false;
        if(e.key===' '||e.key==='Space'||key==='j'){
            if(player.weaponId === 'flamethrower') player.isFlaming = false;
        }
    });

    // ========== AI 切换 ==========
    function toggleAI(){
        aiMode = !aiMode;
        if(aiMode){
            aiToggleBtn.classList.add('active');
            aiIndicator.classList.add('show');
            aiPowerBadge.classList.add('show');
            touchMoveActive = false; touchMoveId = null;
            moveVector = {x:0,y:0};
            joystickVisual.classList.remove('active');
            touchAttackActive = false; touchAttackId = null;
            if(attackHoldTimer){ clearInterval(attackHoldTimer); attackHoldTimer = null; }
            player.isFlaming = false;
            aiState.lastAttackFrame = -999;
            aiState.positionHistory = [];
            aiState.panicTimer = 0;
            aiState.lockedTarget = null; aiState.lockTimer = 0;
            aiState.retreatTimer = 0; aiState.retreatDir = {x:0,y:0};
            aiState.moveDir = {x:0,y:0};
            aiState.modeLockTimer = 0; aiState.lastMode = 'hunt';
        } else {
            aiToggleBtn.classList.remove('active');
            aiIndicator.classList.remove('show');
            aiPowerBadge.classList.remove('show');
            moveVector = {x:0,y:0};
        }
    }
    aiToggleBtn.addEventListener('click', (e)=>{ e.preventDefault(); toggleAI(); });
    aiToggleBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); toggleAI(); }, {passive:false});

    // ========== MJ 切换 ==========
    function toggleMJ(){
        MJ_MODE.enabled = !MJ_MODE.enabled;
        if(MJ_MODE.enabled){
            AudioEngine.play('mj_start');
            if(!aiMode){
                aiMode = true;
                aiToggleBtn.classList.add('active');
                aiIndicator.classList.add('show');
                aiPowerBadge.classList.add('show');
            }
            mjToggleBtn.classList.add('active');
            mjBadge.classList.add('show');
            MJ_MODE.moonwalkPhase = 0; MJ_MODE.tiltAngle = 0; MJ_MODE.spinPhase = 0;
            MJ_MODE.beatTimer = 0; MJ_MODE.comboDisplay = 0; MJ_MODE.comboFade = 0;
            MJ_MODE.currentPose = 'idle'; MJ_MODE.poseTimer = 0;
            MJ_MODE.trailHistory = []; MJ_MODE.sparkles = [];
        } else {
            mjToggleBtn.classList.remove('active');
            mjBadge.classList.remove('show');
            MJ_MODE.trailHistory = []; MJ_MODE.sparkles = [];
        }
    }
    mjToggleBtn.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); toggleMJ(); });
    mjToggleBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); toggleMJ(); }, {passive:false});

    // ========== 仙人按钮 ==========
    immortalBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); activateImmortal(); });
    immortalBtn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); activateImmortal(); }, { passive: false });

    // ========== 成就面板 ==========
    achievementBtn.addEventListener('click', (e)=>{
        e.preventDefault(); e.stopPropagation();
        achievementPanelOpen = !achievementPanelOpen;
        if(achievementPanelOpen){
            if(!isPaused && !gameOver) isPaused = true;
            updateAchievementUI();
            achievementPanel.classList.add('show');
        } else {
            achievementPanel.classList.remove('show');
            if(isPaused && !upgradePanel.classList.contains('show') && !weaponPanel.classList.contains('show') && !gameOver) isPaused = false;
        }
    });
    closeAchievementBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        achievementPanelOpen = false;
        achievementPanel.classList.remove('show');
        if(isPaused && !upgradePanel.classList.contains('show') && !weaponPanel.classList.contains('show') && !gameOver) isPaused = false;
    });

    // ========== 重启 ==========
    function handleRestart(e){
        e.preventDefault(); e.stopPropagation();
        initGame();
        resizeCanvas();
        gameStarted = true;
        setTimeout(()=>showWeaponSelection(false), 200);
    }
    restartBtn.addEventListener('click', handleRestart);
    restartBtn.addEventListener('touchstart', handleRestart, {passive:false});

    canvas.addEventListener('touchstart', (e)=>e.preventDefault(), {passive:false});
    canvas.addEventListener('touchmove', (e)=>e.preventDefault(), {passive:false});
    upgradePanel.addEventListener('touchmove', (e)=>e.preventDefault(), {passive:false});
    achievementPanel.addEventListener('touchmove', (e)=>e.preventDefault(), {passive:false});
    weaponPanel.addEventListener('touchmove', (e)=>e.preventDefault(), {passive:false});

    // ========== 启动 ==========
    window.addEventListener('load', ()=>{
        buildGridCache();
        resizeCanvas();
        initGame();
        gameStarted = true;
        // 音频解锁
        const unlockAudio = () => {
            AudioEngine.resume();
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('touchstart', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
        };
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);
        document.addEventListener('keydown', unlockAudio);
        setTimeout(()=>showWeaponSelection(false), 300);
    });

    buildGridCache();
    resizeCanvas();
    initGame();
    gameStarted = true;
    setTimeout(()=>showWeaponSelection(false), 300);
})();
</script>
</body>
</html>
