<style>

.mj-combo { position:absolute; top:20%; left:50%; transform:translateX(-50%); font-size:clamp(2rem,8vw,4rem); font-weight:bold; color:#ffffff; text-shadow:0 0 20px #ffffff, 0 0 40px #ffcc00, 0 4px 8px black; letter-spacing:4px; z-index:25; pointer-events:none; opacity:0; transition:opacity 0.2s; font-family:'Courier New', monospace; }

<body>
<div id="errorBox"></div>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
        <div class="hud-left">
            <div class="hud-item">❤️ <span id="healthDisplay">6</span></div>

            <div class="hud-item" style="padding:4px 8px;">
                <div class="exp-bar-container">
                    <div class="exp-bar-fill" id="expBarFill"></div>
                    <div class="exp-text" id="expText">0 / 4</div>

            </div>
        </div>
    </div>
    <div class="ai-power-badge" id="aiPowerBadge">🤖 普通AI</div>
    <div class="mj-badge" id="mjBadge">🕴️ MJ形态</div>
    <div class="immortal-badge" id="immortalBadge">🧙 仙人形态 <span id="immortalTimer">12.0</span>s</div>
    <div class="difficulty-badge" id="difficultyBadge">💀 困难模式</div>
    <div class="heavy-badge" id="heavyBadge">⚔️ 破甲: <span id="heavyBonusDisplay">0</span></div>

    <button id="aiToggleBtn" class="top-btn">🤖</button>
    <button id="mjToggleBtn" class="top-btn">🕴️</button>
    <button id="immortalBtn" class="top-btn ready">🧙</button>
    <button id="achievementBtn" class="top-btn">🏆</button>
    <div id="moveZone"></div>
    <div id="joystickVisual"><div id="joystickVisualKnob"></div></div>
    <div id="attackZone"></div>

    <div id="swordCooldownMask"></div>
    <div class="ai-indicator" id="aiIndicator">🤖 AI 控制中</div>

    <div id="upgradePanel">
        <div class="upgrade-title">⚡ 等级提升！</div>

            <div class="achievement-toast-title">成就解锁！</div>
            <div class="achievement-toast-name" id="achievementToastName"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// ========== Web Audio 音效引擎 =================================
// ============================================================
const AudioEngine = (function(){
    let audioCtx = null;
    let masterGain = null;
    let enabled = true;
    let volume = 0.25;

    function ensureContext(){
        if(audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = volume;
            masterGain.connect(audioCtx.destination);
        } catch(e) {
            enabled = false;
        }
    }

    function playTone(freq, duration, type, vol, slideTo, delay){
        if(!enabled) return;
        ensureContext();
        if(!audioCtx) return;
        try {
            const now = audioCtx.currentTime + (delay || 0);
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, now);
            if(slideTo){
                osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
            }
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(vol || 0.2, now + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + duration + 0.05);
        } catch(e){}
    }

    function playNoise(duration, filterFreq, vol, type, sweepTo, delay){
        if(!enabled) return;
        ensureContext();
        if(!audioCtx) return;
        try {
            const now = audioCtx.currentTime + (delay || 0);
            const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0;i<bufferSize;i++){
                data[i] = Math.random() * 2 - 1;
            }
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = type || 'lowpass';
            filter.frequency.setValueAtTime(filterFreq || 1000, now);
            if(sweepTo){
                filter.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), now + duration);
            }
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(vol || 0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            src.start(now);
            src.stop(now + duration + 0.05);
        } catch(e){}
    }

    const sounds = {
        swing_greatsword: () => playNoise(0.18, 2500, 0.22, 'bandpass', 400),
        swing_spear: () => { playTone(900, 0.12, 'sine', 0.18, 1800); playNoise(0.08, 3000, 0.13, 'highpass'); },
        swing_dualblades: () => { playNoise(0.07, 3000, 0.18, 'bandpass', 800); playNoise(0.07, 3000, 0.18, 'bandpass', 800, 0.08); },
        swing_warhammer: () => { playTone(120, 0.35, 'triangle', 0.3, 60); playNoise(0.2, 600, 0.22, 'lowpass'); },
        swing_bat: () => { playTone(1400, 0.1, 'square', 0.12); playNoise(0.25, 4000, 0.25, 'bandpass', 800); },
        boomerang_throw: () => { playTone(600, 0.5, 'sine', 0.12, 400); },
        bullet_pistol: () => { playNoise(0.06, 4000, 0.3, 'highpass'); playTone(180, 0.08, 'square', 0.13, 80); },
        arrow_bow: () => { playTone(200, 0.15, 'sine', 0.22, 800); playNoise(0.1, 2000, 0.13, 'bandpass'); },
        flame_start: () => { playNoise(0.4, 800, 0.18, 'lowpass', 1200); },
        flame_loop: () => { playNoise(0.2, 600, 0.06, 'lowpass'); },
        hit_enemy: () => { playNoise(0.05, 2000, 0.18, 'bandpass'); playTone(600, 0.05, 'square', 0.08, 300); },
        crit: () => { playTone(1200, 0.15, 'sine', 0.25, 2400); playNoise(0.1, 5000, 0.18, 'highpass'); },
        kill_enemy: () => { playTone(200, 0.2, 'triangle', 0.2, 80); playNoise(0.15, 800, 0.18, 'lowpass'); },
        explode: () => { playNoise(0.4, 200, 0.4, 'lowpass', 60); playTone(80, 0.4, 'sine', 0.25, 40); },
        player_hurt: () => { playTone(300, 0.15, 'sawtooth', 0.25, 100); playNoise(0.1, 1000, 0.18, 'lowpass'); },
        player_dodge: () => { playTone(400, 0.2, 'sine', 0.2, 1600); },
        level_up: () => { [523, 659, 784, 1047].forEach((f,i)=>playTone(f, 0.2, 'triangle', 0.22, null, i*0.08)); },
        achievement: () => { [784, 988, 1175].forEach((f,i)=>playTone(f, 0.25, 'sine', 0.25, null, i*0.1)); },
        immortal_start: () => {
            [261, 329, 392, 523, 659, 784].forEach((f,i)=>playTone(f, 0.5, 'sine', 0.22, null, i*0.06));
            playNoise(1.2, 400, 0.35, 'bandpass', 3000);
            playTone(80, 1.2, 'sine', 0.35, 400);
        },
        immortal_end: () => { [1047, 784, 523, 261].forEach((f,i)=>playTone(f, 0.3, 'sine', 0.18, null, i*0.1)); },
        mj_start: () => { [440, 554, 659, 880].forEach((f,i)=>playTone(f, 0.25, 'square', 0.18, null, i*0.12)); },
        button_click: () => { playTone(800, 0.05, 'square', 0.12, 400); },
        spawn_enemy: () => { playTone(200, 0.1, 'sine', 0.06, 300); },
        fuel_empty: () => { playTone(600, 0.3, 'sawtooth', 0.13, 100); },
        combo: (n) => { playTone(600 + n*40, 0.1, 'sine', 0.13, 1200 + n*40); }
    };

    return {
        play: function(name, param){
            if(!enabled) return;
            try {
                const fn = sounds[name];
                if(fn) fn(param);
            } catch(e) {}
        },
        setEnabled: function(v){ enabled = v; },
        isEnabled: function(){ return enabled; },
        resume: function(){
            ensureContext();
            if(audioCtx && audioCtx.state === 'suspended'){
                audioCtx.resume();
            }
        }
    };
})();

    let aiState = { displayMode:'hunt', strafeDir:1, strafeTimer:0, lastAttackFrame:-999, positionHistory:[], panicTimer:0, lockedTarget:null, lockTimer:0, retreatTimer:0, retreatDir:{x:0,y:0}, lastDangerLevel:0, moveDir:{x:0,y:0}, modeLockTimer:0, lastMode:'hunt' };

    const speedLinePool = [], damageNumberPool = [];

    // ========== 工具 ==========
    function getParticle(){ if(particlePool.length>0) return particlePool.pop(); return {x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:0,r:0,g:0,b:0,shape:0,gravity:0}; }
    function recycleParticle(p){ if(particlePool.length<250) particlePool.push(p); }
    function spawnParticles(x,y,count,r,g,b,speed,size,life,shape,gravity){
        shape=shape||0; gravity=gravity===undefined?0.05:gravity;
        const avail=MAX_PARTICLES-particles.length;
        const n=Math.min(count,Math.max(0,avail));
        for(let i=0;i<n;i++){
            const p=getParticle();
            const ang=Math.random()*Math.PI*2;
            const spd=speed*(0.5+Math.random()*0.8);
            p.x=x;p.y=y;p.vx=Math.cos(ang)*spd;p.vy=Math.sin(ang)*spd;
            p.life=life*(0.6+Math.random()*0.6);p.maxLife=p.life;
            p.size=size*(0.6+Math.random()*0.6);
            p.r=r;p.g=g;p.b=b;p.shape=shape;p.gravity=gravity;
            particles.push(p);
        }
    }
    function spawnShockRing(x,y,maxRadius,r,g,b,duration,width){
        width=width||3;
        if(shockRings.length>=MAX_SHOCK_RINGS) return;
        shockRings.push({x,y,radius:0,maxRadius,life:duration,maxLife:duration,r,g,b,width});
    }
    function spawnFloatText(x,y,text,r,g,b,size){

        if(energyPulses.length>=5) return;

    function getSpeedLine(){ if(speedLinePool.length>0) return speedLinePool.pop(); return {x:0,y:0,angle:0,length:0,life:0,decay:0,width:0,r:255,g:240,b:200}; }
    function recycleSpeedLine(sl){ if(speedLinePool.length<150) speedLinePool.push(sl); }
    function getDamageNumber(){ if(damageNumberPool.length>0) return damageNumberPool.pop(); return {x:0,y:0,value:0,life:0,decay:0,vy:0,r:255,g:220,b:100}; }
    function recycleDamageNumber(dn){ if(damageNumberPool.length<80) damageNumberPool.push(dn); }

    // ========== 初始化（难度提升：血 8→6，移速 1.25→1.0，吸血 0.1→0，燃料 100→70） ==========

        enemies = [];

        MJ_MODE.enabled=false; MJ_MODE.moonwalkPhase=0; MJ_MODE.tiltAngle=0; MJ_MODE.spinPhase=0; MJ_MODE.beatTimer=0; MJ_MODE.comboDisplay=0; MJ_MODE.comboFade=0; MJ_MODE.poseTimer=0; MJ_MODE.currentPose='idle'; MJ_MODE.trailHistory=[]; MJ_MODE.sparkles=[];
        mjToggleBtn.classList.remove('active');

    function applyWeapon(weaponId){
        const w = WEAPONS[weaponId];
        if(!w) return;
        player.weaponId = weaponId;
        const rangeMult = player.immortalActive ? 2 : 1;
        swordRange = (w.range + (player.rangeBonus||0)) * rangeMult;
        swordArc = w.arc * (player.arcBonus||1);
        swordCooldownMax = Math.max(8, Math.floor(w.cooldown / (player.attackSpeedMult||1)));
        swordDamage = w.damage;
        weaponNameDisplay.textContent = w.name;
        weaponBadge.style.display = 'flex';
        player.isFlaming = false;
    }

    // ========== 画布 ==========
    function getLogicalSize(){ const dpr = Math.min(window.devicePixelRatio||1, 2); return {w:canvas.width/dpr, h:canvas.height/dpr, dpr}; }
    function resizeCanvas(){
        const dpr = Math.min(window.devicePixelRatio||1, 2);
        canvas.width = window.innerWidth*dpr;
        canvas.height = window.innerHeight*dpr;
        canvas.style.width = window.innerWidth+'px';
        canvas.style.height = window.innerHeight+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        if(player){
            camera.x = player.x - window.innerWidth/2;
            camera.y = player.y - window.innerHeight/2;
            cameraTarget.x = camera.x; cameraTarget.y = camera.y;
            clampCamera();
        }
    }
    function clampCamera(){
        const {w,h} = getLogicalSize();
        camera.x = Math.max(0, Math.min(WORLD_WIDTH-w, camera.x));
        camera.y = Math.max(0, Math.min(WORLD_HEIGHT-h, camera.y));
    }
    window.addEventListener('resize', resizeCanvas);

    // ========== HUD ==========
    function updateHUD(){ healthSpan.textContent = player.health; killSpan.textContent = kills; }
    function updateExpBar(){ const pct = (player.exp/player.expToNext)*100; expBarFill.style.width = pct+'%'; expText.textContent = player.exp+' / '+player.expToNext; }
    function updateSwordButtonState(){ if(swordCooldown>0) swordBtn.classList.add('cooldown'); else swordBtn.classList.remove('cooldown'); }
    function updateCooldownMask(){ if(swordCooldownMax<=0) return; const deg = (swordCooldown/swordCooldownMax)*360; swordCooldownMask.style.background = `conic-gradient(rgba(0,0,0,0.6) ${deg}deg, transparent ${deg}deg)`; }
    function updateHeavyBonusDisplay(){ heavyBonusDisplay.textContent = player.heavyBonus; if(player.heavyBonus>0) heavyBadge.classList.add('show'); else heavyBadge.classList.remove('show'); }

    // ========== 成就 ==========
    function updateAchievementUI(){
        const unlocked = unlockedAchievements.size;
        achievementProgress.textContent = `已解锁 ${unlocked} / ${ACHIEVEMENTS.length}`;
        achievementList.innerHTML = '';
        for(const ach of ACHIEVEMENTS){
            const isU = unlockedAchievements.has(ach.id);
            const div = document.createElement('div');
            div.className = 'achievement-item '+(isU?'unlocked':'locked');
            div.innerHTML = `<div class="achievement-icon">${ach.icon}</div>
                <div class="achievement-info"><div class="achievement-name">${ach.name}</div>
                <div class="achievement-desc">${ach.desc}</div></div>
                <div class="achievement-status">${isU?'✅ 已解锁':'🔒 未解锁'}</div>`;
            achievementList.appendChild(div);
        }
    }
    function checkAchievements(){
        for(const ach of ACHIEVEMENTS){
            if(!unlockedAchievements.has(ach.id) && ach.check()){
                unlockedAchievements.add(ach.id);
                updateAchievementUI();
                AudioEngine.play('achievement');
                achievementToastIcon.textContent = ach.icon;
                achievementToastName.textContent = ach.name;
                achievementToast.classList.add('show');
                if(achievementToastTimer) clearTimeout(achievementToastTimer);
                achievementToastTimer = setTimeout(()=>achievementToast.classList.remove('show'), 2600);
            }
        }
    }

    // ========== 武器选择 ==========
    function showWeaponSelection(isSwap){
        isPaused = true;
        weaponCards.innerHTML = '';
        WEAPON_LIST.forEach(wid=>{
            const w = WEAPONS[wid];
            const card = document.createElement('div');
            card.className = 'weapon-card';
            if(wid === player.weaponId) card.classList.add('selected');
            card.innerHTML = `<div class="weapon-icon">${w.icon}</div>
                <div class="weapon-info">
                    <div class="weapon-name">${w.name}${wid===player.weaponId?' (当前)':''}</div>
                    <div class="weapon-desc">${w.desc}</div>
                    <div class="weapon-stats">${w.stats}</div>
                </div>`;
            const handler = (ev)=>{ ev.preventDefault(); ev.stopPropagation(); applyWeapon(wid); updateHUD(); weaponPanel.classList.remove('show'); isPaused = false; AudioEngine.play('button_click'); if(isSwap && player.exp >= player.expToNext) setTimeout(checkLevelUp, 100); };
            card.addEventListener('click', handler);
            card.addEventListener('touchstart', handler, {passive:false});
            weaponCards.appendChild(card);
        });
        weaponPanel.classList.add('show');
    }

    // ========== 敌人 ==========
    function pickEnemyType(){
        const avail = ENEMY_TYPE_LIST.filter(t=>kills>=ENEMY_TYPES[t].minKills);
        if(avail.length===0) return 'grunt';
        let total=0;
        const weights = avail.map(t=>{ total+=ENEMY_TYPES[t].spawnWeight; return ENEMY_TYPES[t].spawnWeight; });
        let roll = Math.random()*total;
        for(let i=0;i<avail.length;i++){ roll-=weights[i]; if(roll<=0) return avail[i]; }
        return avail[avail.length-1];
    }
    function spawnEnemy(safeSpawn, forceType){
        if(enemies.length>=MAX_ENEMIES) return;
        const typeKey = forceType||pickEnemyType();
        const type = ENEMY_TYPES[typeKey];
        if(!type) return;
        const minDist = safeSpawn?550:400;
        let sx=0, sy=0, ok=false, tries=0;
        while(!ok && tries<80){
            sx = 100+Math.random()*(WORLD_WIDTH-200);
            sy = 100+Math.random()*(WORLD_HEIGHT-200);
            if(Math.hypot(sx-player.x, sy-player.y) > minDist) ok = true;
            tries++;
        }
        if(!ok){
            const ang = Math.random()*Math.PI*2;
            sx = Math.max(50, Math.min(WORLD_WIDTH-50, player.x+Math.cos(ang)*650));
            sy = Math.max(50, Math.min(WORLD_HEIGHT-50, player.y+Math.sin(ang)*650));
        }
        // 难度提升：每 20 杀 +45% 血量（原每 30 杀 +35%）
        const hpMul = 1+Math.floor(kills/20)*0.45;
        const hp = Math.ceil(type.healthBase*hpMul);
        const e = {
            x:sx, y:sy, attackTimer:0, radius:type.radius, health:hp, maxHealth:hp,
            hitFlash:0, knockbackVX:0, knockbackVY:0, spawnTimer:25,
            typeKey, type, weightClass:type.weightClass||'light',
            wobblePhase:Math.random()*Math.PI*2, phaseTimer:0, phaseActive:false,
            summonTimer:type.summoner?60:0,
            shield:type.shield?type.shield.maxShield:0,
            maxShield:type.shield?type.shield.maxShield:0,
            shieldRegenTimer:0, burnTimer:0, healTimer:type.healer?90:0,
            stunTimer:0, homeRunTimer:0, homeRunDamage:0,
            burnTimer2:0, burnDamage2:0, burnTick:0,
            spawnPulse: 1.0
        };
        if(type.ranged) e.rangedAttackTimer = type.attackCooldown*0.5;
        enemies.push(e);
        AudioEngine.play('spawn_enemy');
        spawnShockRing(sx, sy, type.radius*3, type.color.r, type.color.g, type.color.b, 20, 2);
        spawnParticles(sx, sy, 8, type.color.r, type.color.g, type.color.b, 3, 4, 30, 0);
    }

    // ========== 攻击 ==========
    function trySwordAttack(){
        if(gameOver || isPaused || achievementPanelOpen) return false;
        if(swordCooldown>0 || swingAnim.active) return false;

        const w = WEAPONS[player.weaponId];
        if(w){
            const rangeMult = player.immortalActive ? 2 : 1;
            swordRange = (w.range + (player.rangeBonus||0)) * rangeMult;
            swordArc = w.arc * (player.arcBonus||1);
            swordCooldownMax = Math.max(8, Math.floor(w.cooldown / (player.attackSpeedMult||1)));
            swordDamage = w.damage;
        }

        const cdMult = player.immortalActive ? 0.3 : 1;
        if(WEAPON_SOUND_MAP[player.weaponId]) AudioEngine.play(WEAPON_SOUND_MAP[player.weaponId]);

        if(w && w.isRanged){
            if(w.rangedType === 'flame'){
                if(player.flameFuel <= 0) return false;
                if(player.isFlaming) return false;
                player.isFlaming = true;
                applyFlameDamage();
                return true;
            }
            if(w.rangedType === 'bullet' || w.rangedType === 'arrow'){
                swordCooldown = Math.floor(swordCooldownMax * cdMult);
                updateSwordButtonState(); updateCooldownMask();
                bullets.push({
                    x: player.x + Math.cos(player.facing) * (PLAYER_RADIUS + 8),
                    y: player.y + Math.sin(player.facing) * (PLAYER_RADIUS + 8),
                    vx: Math.cos(player.facing) * w.bulletSpeed,
                    vy: Math.sin(player.facing) * w.bulletSpeed,
                    damage: w.damage, pierce: w.pierce, maxDistance: w.range,
                    distance: 0, hitEnemies: new Set(), type: w.rangedType,
                    angle: player.facing, color: w.color, knockbackMult: w.knockbackMult
                });
                triggerShake(3, 4);
                spawnParticles(player.x + Math.cos(player.facing)*PLAYER_RADIUS, player.y + Math.sin(player.facing)*PLAYER_RADIUS, 6, 255, 240, 120, 4, 3, 15, 0);
                return true;
            }
        }

        if(player.weaponId === 'boomerang'){
            swordCooldown = Math.floor(swordCooldownMax * cdMult);
            updateSwordButtonState(); updateCooldownMask();
            boomerangs.push({
                x: player.x, y: player.y, angle: player.facing,
                distance: 0, maxDistance: w ? w.range : 110,
                speed: 6, phase: 'out', hitEnemies: new Set(), rotation: 0
            });
            spawnEnergyPulse(player.x, player.y, 255, 200, 100);
            swordBtn.classList.add('pressed');
            setTimeout(()=>swordBtn.classList.remove('pressed'), 80);
            return true;
        }

        swordCooldown = Math.floor(swordCooldownMax * cdMult);
        updateSwordButtonState(); updateCooldownMask();
        const attackAngle = player.facing;
        const halfArc = swordArc/2;
        const newDir = swingAnim.direction===1?-1:1;
        const windupAngle = attackAngle - newDir*halfArc*0.85;
        let slashStart, slashEnd;
        if(newDir===1){ slashStart = attackAngle-halfArc; slashEnd = attackAngle+halfArc; }
        else { slashStart = attackAngle+halfArc; slashEnd = attackAngle-halfArc; }
        swingAnim.active = true; swingAnim.phase='windup'; swingAnim.frame=0;
        swingAnim.direction = newDir; swingAnim.hitApplied = false;
        swingAnim.windupAngle = windupAngle; swingAnim.slashStartAngle = slashStart;
        swingAnim.slashEndAngle = slashEnd; swingAnim.baseFacing = attackAngle;
        spawnEnergyPulse(player.x, player.y, 126, 214, 223);
        swordBtn.classList.add('pressed');
        setTimeout(()=>swordBtn.classList.remove('pressed'), 80);
        return true;
    }

    function applySwordDamage(){
        const attackAngle = swingAnim.baseFacing;
        const halfArc = swordArc/2;
        const reach = PLAYER_RADIUS+swordRange;
        let hitAny = false;
        const w = WEAPONS[player.weaponId];
        const pierce = w ? w.pierce : 0;
        const knockbackMult = w ? w.knockbackMult : 1;
        const stunFrames = w ? w.stun : 0;
        let hitCount = 0;
        const maxHits = pierce > 0 ? pierce : 9999;

        for(let i=enemies.length-1;i>=0;i--){
            const e = enemies[i]; const type = e.type;
            if(type.phase && e.phaseActive) continue;
            const dx = e.x-player.x, dy = e.y-player.y;
            const dist = Math.hypot(dx,dy);
            if(dist > reach+e.radius) continue;
            if(hitCount >= maxHits) break;
            const enemyAngle = Math.atan2(dy,dx);
            let diff = enemyAngle-attackAngle;
            while(diff>Math.PI) diff-=Math.PI*2;
            while(diff<-Math.PI) diff+=Math.PI*2;
            if(Math.abs(diff)>halfArc) continue;
            hitAny = true;
            hitCount++;
            let damage = w ? Math.floor(w.damage * player.damageMultiplier) : Math.floor(swordDamage*player.damageMultiplier);
            if(e.weightClass==='heavy') damage += player.heavyBonus;
            if(player.immortalActive) damage = Math.floor(damage * 5);
            if(e.shield>0){
                const sd = Math.min(e.shield, damage);
                e.shield -= sd;
                const rem = damage-sd;
                spawnParticles(e.x, e.y, 5, 150, 220, 255, 4, 3, 20, 1);
                spawnFloatText(e.x, e.y-20, '护盾 -'+sd, 150, 220, 255, 18);
                if(rem>0){ e.health -= rem; e.hitFlash = 6; AudioEngine.play('hit_enemy'); }
            } else { e.health -= damage; e.hitFlash = 6; AudioEngine.play('hit_enemy'); }
            if(player.knockback>0 || knockbackMult>1){
                const ang = Math.atan2(dy,dx);
                let kb = (player.knockback||0) * 0.15 * knockbackMult;
                if(player.immortalActive) kb *= 2;
                e.knockbackVX = Math.cos(ang)*kb;
                e.knockbackVY = Math.sin(ang)*kb;
                if(w && w.id === 'baseballbat'){
                    e.homeRunTimer = 60;
                    e.homeRunDamage = damage;
                    spawnFloatText(e.x, e.y-45, '全垒打!', 255, 200, 60, 22);
                    triggerShake(10, 12);
                    AudioEngine.play('crit');
                    for(let s=0;s<12;s++){
                        const sl = getSpeedLine();
                        sl.x = e.x; sl.y = e.y;
                        sl.angle = Math.atan2(dy,dx) + (Math.random()-0.5)*1.2;
                        sl.length = 30+Math.random()*25;
                        sl.life = 1.0; sl.decay = 0.12;
                        sl.width = 2+Math.random()*2;
                        sl.r = 255; sl.g = 220; sl.b = 100;
                        speedLines.push(sl);
                    }
                }
            }
            if(stunFrames > 0){
                e.stunTimer = Math.max(e.stunTimer||0, stunFrames);
                spawnFloatText(e.x, e.y-40, '眩晕!', 200, 200, 100, 20);
                for(let s=0;s<4;s++){
                    const sl = getSpeedLine();
                    sl.x = e.x; sl.y = e.y;
                    sl.angle = Math.random()*Math.PI*2;
                    sl.length = 15+Math.random()*20;
                    sl.life = 1.0; sl.decay = 0.15;
                    sl.width = 3;
                    sl.r = 255; sl.g = 255; sl.b = 100;
                    speedLines.push(sl);
                }
            }
            triggerShake(4,6);
            spawnParticles(e.x, e.y, 6, 255, 220, 100, 4, 3, 20, 0);
            spawnParticles(e.x, e.y, 3, type.coreColor.r, type.coreColor.g, type.coreColor.b, 3, 2, 18, 1);
            const col = player.immortalActive ? {r:255,g:220,b:255} : ((e.weightClass==='heavy' && player.heavyBonus>0)?{r:245,g:200,b:66}:{r:255,g:229,b:102});
            spawnFloatText(e.x, e.y-20, '-'+damage, col.r, col.g, col.b, 18+damage*2);
            const dn = getDamageNumber();
            dn.x = e.x; dn.y = e.y-15; dn.value = damage; dn.life = 1.0;
            dn.decay = 0.035; dn.vy = -1.2; dn.r = col.r; dn.g = col.g; dn.b = col.b;
            damageNumbers.push(dn);
            for(let s=0;s<3;s++){
                const sl = getSpeedLine();
                sl.x = e.x; sl.y = e.y; sl.angle = Math.random()*Math.PI*2;
                sl.length = 12+Math.random()*15; sl.life = 1.0;
                sl.decay = 0.08+Math.random()*0.04; sl.width = 1+Math.random()*2;
                if(player.immortalActive){ sl.r = 200; sl.g = 160; sl.b = 255; }
                else { sl.r = 255; sl.g = 240; sl.b = 180; }
                speedLines.push(sl);
            }
            if(e.health<=0){
                enemyDeathExplosion(e);
                enemies.splice(i,1);
                kills++;
                AudioEngine.play('kill_enemy');
                onMJKill();
                if(player.lifesteal>0 && Math.random()<player.lifesteal){
                    player.health = Math.min(player.maxHealth, player.health+1);
                    updateHUD();
                    spawnFloatText(player.x, player.y-30, '+1', 100, 255, 140, 20);
                }
                player.exp += Math.floor(e.type.expValue*player.expMultiplier);
                checkLevelUp();
            }
        }
        if(hitAny){ updateHUD(); updateExpBar(); }
    }

    function applyFlameDamage(){
        const w = WEAPONS.flamethrower;
        const rangeMult = player.immortalActive ? 2 : 1;
        const reach = w.range * rangeMult;
        const halfArc = w.arc / 2;
        const attackAngle = player.facing;
        let hitAny = false;
        for(let i=enemies.length-1; i>=0; i--){
            const e = enemies[i];
            if(e.type.phase && e.phaseActive) continue;
            const dx = e.x - player.x, dy = e.y - player.y;
            const dist = Math.hypot(dx,dy);
            if(dist > reach + e.radius) continue;
            const ang = Math.atan2(dy,dx);
            let diff = ang - attackAngle;
            while(diff > Math.PI) diff -= Math.PI*2;
            while(diff < -Math.PI) diff += Math.PI*2;
            if(Math.abs(diff) > halfArc) continue;
            hitAny = true;
            const falloff = 1 - dist/reach * 0.4;
            let damage = w.damage * falloff * player.damageMultiplier;
            if(player.immortalActive) damage *= 5;
            if(e.weightClass === 'heavy') damage += player.heavyBonus * 0.3;
            e.health -= damage;
            e.hitFlash = 3;
            AudioEngine.play('hit_enemy');
            e.burnTimer2 = 180;
            e.burnDamage2 = player.immortalActive ? 2 : 1;
            e.burnTick = 0;
            if(Math.random() < 0.4){
                spawnParticles(e.x, e.y, 3, 255, 130, 40, 2, 3, 18, 0);
            }
            if(e.health <= 0){
                enemyDeathExplosion(e);
                enemies.splice(i,1);
                kills++;
                AudioEngine.play('kill_enemy');
                onMJKill();
                if(player.lifesteal>0 && Math.random()<player.lifesteal){
                    player.health = Math.min(player.maxHealth, player.health+1);
                    updateHUD();
                }
                player.exp += Math.floor(e.type.expValue * player.expMultiplier);
                checkLevelUp();
            }
        }
        for(let s=0; s<8; s++){
            const spread = (Math.random()-0.5) * w.arc;
            const ang = attackAngle + spread;
            const spd = 8 + Math.random()*6;
            const col = player.immortalActive ? [200, 160, 255] : [255, 100+Math.floor(Math.random()*100), 30];
            spawnParticles(
                player.x + Math.cos(attackAngle)*PLAYER_RADIUS,
                player.y + Math.sin(attackAngle)*PLAYER_RADIUS,
                1, col[0], col[1], col[2],
                spd, 5+Math.random()*4, 22, 0, 0.02
            );
        }
        if(hitAny){ updateHUD(); updateExpBar(); }
    }

    function updateSwingAnim(){
        if(!swingAnim.active) return;
        swingAnim.frame++;
        if(swingAnim.phase==='windup'){
            if(swingAnim.frame>=WINDUP_FRAMES){ swingAnim.phase='anticipation'; swingAnim.frame=0; }
        } else if(swingAnim.phase==='anticipation'){
            if(swingAnim.frame>=ANTICIPATION_FRAMES){ swingAnim.phase='slash'; swingAnim.frame=0; }
        } else if(swingAnim.phase==='slash'){
            if(!swingAnim.hitApplied && swingAnim.frame>=Math.floor(SLASH_FRAMES*0.3)){ applySwordDamage(); swingAnim.hitApplied = true; }
            if(swingAnim.frame>=SLASH_FRAMES){ swingAnim.phase='recover'; swingAnim.frame=0; }
        } else if(swingAnim.phase==='recover'){
            if(swingAnim.frame>=RECOVER_FRAMES){ swingAnim.active=false; swingAnim.phase='idle'; swingAnim.frame=0; player.bodyTilt=0; }
        }
    }

    // ========== 敌人死亡爆炸 ==========
    function enemyDeathExplosion(e){
        const type = e.type; const cx = e.x, cy = e.y;
        const c = type.color, cc = type.coreColor;
        spawnShockRing(cx, cy, type.radius*4, c.r, c.g, c.b, 22, 5);
        spawnShockRing(cx, cy, type.radius*6, cc.r, cc.g, cc.b, 28, 2);
        spawnParticles(cx, cy, 12, c.r, c.g, c.b, 5, 4, 35, 0);
        spawnParticles(cx, cy, 6, cc.r, cc.g, cc.b, 6, 3, 28, 1);
        spawnParticles(cx, cy, 4, 255, 255, 255, 4, 2, 22, 2);
        let si = 5;
        if(e.typeKey==='tank') si=8;
        else if(e.typeKey==='elite') si=10;
        else if(e.typeKey==='bomber') si=8;
        else if(e.typeKey==='summoner') si=12;
        else if(e.typeKey==='lava') si=9;
        triggerShake(si,8);
        spawnFloatText(cx, cy-30, type.name, c.r, c.g, c.b, 18);
        if(type.explodesOnDeath && explosionQueue.length<50){
            explosionQueue.push({x:cx, y:cy, type, typeKey:e.typeKey, timer:type.explosionDelay||0, maxTimer:type.explosionDelay||0});
        }
        if(type.splitsOnDeath){
            for(let s=0;s<type.splitCount;s++){
                const ang = Math.random()*Math.PI*2;
                const dd = 30+Math.random()*30;
                const sx = cx+Math.cos(ang)*dd, sy = cy+Math.sin(ang)*dd;
                const st = ENEMY_TYPES[type.splitType];
                if(!st) continue;
                // 难度提升：每 20 杀 +45% 血量
                const hpMul = 1+Math.floor(kills/20)*0.45;
                const hp = Math.ceil(st.healthBase*hpMul*0.5);
                enemies.push({ x:Math.max(20,Math.min(WORLD_WIDTH-20,sx)), y:Math.max(20,Math.min(WORLD_HEIGHT-20,sy)),
                    attackTimer:0, radius:st.radius, health:hp, maxHealth:hp, hitFlash:0,
                    knockbackVX:0, knockbackVY:0, spawnTimer:15, typeKey:type.splitType, type:st,
                    weightClass:st.weightClass||'light', wobblePhase:Math.random()*Math.PI*2,
                    phaseTimer:0, phaseActive:false, summonTimer:0, shield:0, maxShield:0,
                    shieldRegenTimer:0, burnTimer:0, healTimer:0, stunTimer:0,
                    homeRunTimer:0, homeRunDamage:0, burnTimer2:0, burnDamage2:0, burnTick:0, spawnPulse:1.0 });
            }
            spawnParticles(cx, cy, 12, 200, 150, 80, 4, 4, 30, 0);
        }
    }

    function processExplosionQueue(){
        let processed = 0;
        for(let i=0;i<explosionQueue.length;i++){ if(explosionQueue[i].timer>0) explosionQueue[i].timer--; }
        while(explosionQueue.length>0 && processed<8){
            const exp = explosionQueue[0];
            if(exp.timer>0) break;
            explosionQueue.shift(); processed++;
            const cx = exp.x, cy = exp.y; const type = exp.type;
            const r = type.explosionRadius;
            AudioEngine.play('explode');
            spawnShockRing(cx, cy, r, 255, 100, 255, 35, 6);
            spawnShockRing(cx, cy, r*1.3, 255, 150, 255, 40, 3);
            spawnParticles(cx, cy, 18, 255, 100, 255, 7, 5, 45, 0);
            spawnParticles(cx, cy, 10, 255, 200, 255, 5, 4, 35, 1);
            triggerShake(12,15);
            const dp = Math.hypot(player.x-cx, player.y-cy);
            if(dp<r && player.health>0 && !gameOver && player.invulnTimer<=0){
                let edmg = type.explosionDamage;
                if(player.immortalActive) edmg = Math.max(0, Math.floor(edmg * 0.1));
                player.health -= edmg;
                player.invulnTimer = PLAYER_INVULN_FRAMES;
                updateHUD();
                if(edmg > 0){
                    AudioEngine.play('player_hurt');
                    spawnFloatText(player.x, player.y-30, '-'+edmg, 255, 50, 50, 24);
                    triggerShake(15,15);
                }
                if(player.health<=0){
                    player.health = 0; gameOver = true; updateHUD();
                    spawnParticles(player.x, player.y, 25, 255, 120, 120, 5, 6, 50, 0);
                    spawnShockRing(player.x, player.y, 200, 255, 60, 60, 30, 5);
                }
            }
            for(let j=enemies.length-1;j>=0;j--){
                const other = enemies[j];
                if(Math.hypot(other.x-cx, other.y-cy)<r){
                    other.health -= 3; other.hitFlash = 8;
                    if(other.health<=0){
                        enemyDeathExplosion(other);
                        enemies.splice(j,1); kills++;
                        AudioEngine.play('kill_enemy');
                        player.exp += Math.floor((other.type.expValue||1)*player.expMultiplier);
                        checkLevelUp();
                    }
                }
            }
        }
    }

        if(player.exp < player.expToNext){ updateExpBar(); return; }
        player.exp -= player.expToNext;
        player.level++;
        player.expToNext = Math.floor(player.expToNext*1.5)+2;
        AudioEngine.play('level_up');
        spawnShockRing(player.x, player.y, 140, 245, 229, 107, 30, 5);

        spawnFloatText(player.x, player.y-50, 'LEVEL UP!', 245, 229, 107, 26);
        spawnEnergyPulse(player.x, player.y, 126, 214, 223);
        triggerShake(10,20);
        updateExpBar();

    function showUpgradeSelection(){
        isPaused = true;
        const shuffled = [...UPGRADE_POOL].sort(()=>Math.random()-0.5);
        const choices = shuffled.slice(0,3);
        upgradeCards.innerHTML = '';
        choices.forEach(choice=>{
            const card = document.createElement('div');
            card.className = 'upgrade-card'+(choice.isHeavy?' heavy-upgrade':'')+(choice.isWeaponSwap?' weapon-swap':'');
            card.innerHTML = `<div class="upgrade-icon">${choice.icon}</div>
                <div class="upgrade-info"><div class="upgrade-name">${choice.name}</div>
                <div class="upgrade-desc">${choice.desc}</div></div>`;
            const handler = (ev)=>{ ev.preventDefault(); ev.stopPropagation();
                AudioEngine.play('button_click');
                if(choice.isWeaponSwap){ upgradePanel.classList.remove('show'); showWeaponSelection(true); return; }
                choice.apply();
                applyWeapon(player.weaponId);
                updateHUD(); updateExpBar();
                upgradePanel.classList.remove('show');
                isPaused = false;
                if(player.exp>=player.expToNext) setTimeout(checkLevelUp, 100);
            };
            card.addEventListener('click', handler);
            card.addEventListener('touchstart', handler, {passive:false});
            upgradeCards.appendChild(card);
        });
        upgradePanel.classList.add('show');
        if(aiMode){
            setTimeout(()=>{
                if(!upgradePanel.classList.contains('show')) return;
                const hpPct = player.health/player.maxHealth;
                const heavyCount = enemies.filter(e=>e.weightClass==='heavy').length;
                let order;
                if(hpPct<0.4) order = ['max_health','lifesteal','move_speed','sword_damage','attack_speed','sword_range','sword_arc','exp_boost','knockback','heavy_bane','swap_weapon'];
                else if(enemies.length>15||heavyCount>5) order = ['sword_arc','sword_range','attack_speed','sword_damage','heavy_bane','max_health','move_speed','lifesteal','exp_boost','knockback','swap_weapon'];
                else order = ['sword_damage','attack_speed','sword_range','sword_arc','heavy_bane','move_speed','max_health','lifesteal','exp_boost','knockback','swap_weapon'];
                let best = choices[0], bestIdx = Infinity;
                for(const c of choices){ const i = order.indexOf(c.id); if(i>=0 && i<bestIdx){ bestIdx = i; best = c; } }
                const cards = upgradeCards.querySelectorAll('.upgrade-card');
                for(const c of cards){ if(c.querySelector('.upgrade-name').textContent===best.name){ c.click(); break; } }
            }, 400);
        }
    }

        if (player.immortalCooldown > 0) return false;

        AudioEngine.play('immortal_start');

        player.immortalCooldown = IMMORTAL_COOLDOWN;

    function updateImmortal() {
        if (!player.immortalActive) {
            if (player.immortalCooldown > 0) {
                player.immortalCooldown--;
                if (player.immortalCooldown === 0) {
                    immortalBtn.classList.add('ready');
                }
            }
            return;
        }
        player.immortalTimer--;
        const secs = (player.immortalTimer / 60).toFixed(1);
        const timerEl = document.getElementById('immortalTimer');
        if (timerEl) timerEl.textContent = secs;

        for (let i = 0; i < 4; i++) {
            const ang = Math.random() * Math.PI * 2;
            const dist = 20 + Math.random() * 50;
            spawnParticles(
                player.x + Math.cos(ang) * dist,
                player.y + Math.sin(ang) * dist,
                1, 200, 160, 255, 1.5, 4, 28, 0, -0.02
            );
        }

        player.immortalTick = (player.immortalTick || 0) + 1;
        if (player.immortalTick >= IMMORTAL_TICK_INTERVAL) {
            player.immortalTick = 0;
            executeImmortalSlash();
        }

        if (player.immortalTimer <= 0) {
            player.immortalActive = false;
            immortalBtn.classList.remove('active');
            immortalBadge.classList.remove('show');
            AudioEngine.play('immortal_end');
            spawnFloatText(player.x, player.y - 40, '仙人形态结束', 180, 140, 255, 22);
            spawnShockRing(player.x, player.y, 180, 180, 140, 255, 30, 3);
        }
    }

    function executeImmortalSlash() {
        const RADIUS = 250;
        const DAMAGE = 4;  // 难度提升：5→4
        let killed = 0;
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (e.type.phase && e.phaseActive) continue;
            const d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d <= RADIUS) {
                e.health -= DAMAGE;
                e.hitFlash = 8;
                spawnFloatText(e.x, e.y - 20, '-' + DAMAGE, 255, 200, 255, 22);
                for (let s = 0; s < 4; s++) {
                    const ang = Math.atan2(e.y - player.y, e.x - player.x) + (Math.random() - 0.5) * 0.3;
                    const sl = getSpeedLine();
                    sl.x = player.x; sl.y = player.y;
                    sl.angle = ang;
                    sl.length = d * 0.8;
                    sl.life = 1.0;
                    sl.decay = 0.1;
                    sl.width = 3;
                    sl.r = 200; sl.g = 160; sl.b = 255;
                    speedLines.push(sl);
                }
                if (e.health <= 0) {
                    enemyDeathExplosion(e);
                    enemies.splice(i, 1);
                    kills++;
                    AudioEngine.play('kill_enemy');
                    if (player.lifesteal > 0 && Math.random() < player.lifesteal) {
                        player.health = Math.min(player.maxHealth, player.health + 1);
                        updateHUD();
                    }
                    player.exp += Math.floor(e.type.expValue * player.expMultiplier);
                    checkLevelUp();
                    killed++;
                }
            }
        }
        if (killed > 0) {
            spawnShockRing(player.x, player.y, RADIUS, 200, 160, 255, 25, 4);
            triggerShake(6, 8);
        }
    }

    // ========== 输入 ==========
    function updateMoveVector(){
        if(!touchMoveActive){ moveVector = {x:0,y:0}; return; }
        let dx = touchMoveCurrentX-touchMoveStartX;
        let dy = touchMoveCurrentY-touchMoveStartY;
        const dist = Math.hypot(dx,dy);
        if(dist<8){ moveVector = {x:0,y:0}; return; }
        const mag = Math.min(dist/touchMaxDist, 1.0);
        const ang = Math.atan2(dy,dx);
        const cm = Math.pow(mag, 0.8);
        moveVector = {x:Math.cos(ang)*cm, y:Math.sin(ang)*cm};
    }
    function handleMoveStart(e){
        e.preventDefault();
        if(gameOver||isPaused||aiMode||achievementPanelOpen||!gameStarted) return;
        const t = e.changedTouches?e.changedTouches[0]:e;
        if(!t||touchMoveActive) return;
        touchMoveActive = true;
        touchMoveId = e.changedTouches?t.identifier:'mouse';
        touchMoveStartX = t.clientX; touchMoveStartY = t.clientY;
        touchMoveCurrentX = t.clientX; touchMoveCurrentY = t.clientY;
        const rect = gameContainer.getBoundingClientRect();
        joystickVisual.style.left = (t.clientX-rect.left)+'px';
        joystickVisual.style.top = (t.clientY-rect.top)+'px';
        joystickVisual.classList.add('active');
        joystickVisualKnob.style.transform = 'translate(-50%,-50%)';
        updateMoveVector();
    }
    function handleMoveMove(e){
        if(!touchMoveActive) return;
        let t = null;
        if(e.changedTouches){
            for(let i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===touchMoveId){ t = e.changedTouches[i]; break; } }
            if(!t) return;
        } else t = e;
        e.preventDefault();
        touchMoveCurrentX = t.clientX; touchMoveCurrentY = t.clientY;
        updateMoveVector();
        let dx = touchMoveCurrentX-touchMoveStartX;
        let dy = touchMoveCurrentY-touchMoveStartY;
        const dist = Math.hypot(dx,dy);
        if(dist>50){ dx = (dx/dist)*50; dy = (dy/dist)*50; }
        joystickVisualKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }
    function handleMoveEnd(e){
        if(!touchMoveActive) return;
        if(e.changedTouches){
            let still = false;
            for(let i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===touchMoveId){ still = true; break; } }
            if(!still) return;
        }
        e.preventDefault();
        touchMoveActive = false; touchMoveId = null;
        moveVector = {x:0,y:0};
        joystickVisual.classList.remove('active');
        joystickVisualKnob.style.transform = 'translate(-50%,-50%)';
    }
    moveZone.addEventListener('touchstart', handleMoveStart, {passive:false});
    moveZone.addEventListener('touchmove', handleMoveMove, {passive:false});
    moveZone.addEventListener('touchend', handleMoveEnd, {passive:false});
    moveZone.addEventListener('touchcancel', handleMoveEnd, {passive:false});
    moveZone.addEventListener('mousedown', (e)=>{ if(e.button!==0) return; handleMoveStart(e); });
    window.addEventListener('mousemove', (e)=>{ if(touchMoveActive && touchMoveId==='mouse') handleMoveMove(e); });
    window.addEventListener('mouseup', (e)=>{ if(touchMoveActive && touchMoveId==='mouse') handleMoveEnd(e); });

    function handleAttackStart(e){
        e.preventDefault();
        if(gameOver||isPaused||aiMode||achievementPanelOpen||!gameStarted) return;
        if(touchAttackActive) return;
        touchAttackActive = true;
        touchAttackId = e.changedTouches?e.changedTouches[0].identifier:'mouse';
        trySwordAttack();
        if(attackHoldTimer) clearInterval(attackHoldTimer);
        attackHoldTimer = setInterval(()=>{
            if(touchAttackActive && !gameOver && !isPaused) trySwordAttack();
        }, 120);
    }
    function handleAttackEnd(e){
        if(!touchAttackActive) return;
        if(e.changedTouches){
            let still = false;
            for(let i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===touchAttackId){ still = true; break; } }
            if(!still) return;
        }
        e.preventDefault();
        touchAttackActive = false; touchAttackId = null;
        if(player.weaponId === 'flamethrower') player.isFlaming = false;
        if(attackHoldTimer){ clearInterval(attackHoldTimer); attackHoldTimer = null; }
    }
    attackZone.addEventListener('touchstart', handleAttackStart, {passive:false});
    attackZone.addEventListener('touchend', handleAttackEnd, {passive:false});
    attackZone.addEventListener('touchcancel', handleAttackEnd, {passive:false});
    attackZone.addEventListener('mousedown', (e)=>{ if(e.button!==0) return; handleAttackStart(e); });
    window.addEventListener('mouseup', (e)=>{ if(touchAttackActive && touchAttackId==='mouse') handleAttackEnd(e); });

    function handleInput(){
        if(gameOver||isPaused||achievementPanelOpen||!gameStarted) return;
        updateImmortal();
        if(aiMode){ updateAI(); return; }
        let dx=0, dy=0;
        const ks = window.keyState;
        if(ks){
            if(ks.w||ks.up) dy -= 1;
            if(ks.s||ks.down) dy += 1;
            if(ks.a||ks.left) dx -= 1;
            if(ks.d||ks.right) dx += 1;
        }
        dx += moveVector.x; dy += moveVector.y;
        const len = Math.hypot(dx,dy);
        if(len>1){ dx/=len; dy/=len; }
        let sm = 1.0;
        if(swingAnim.active){
            if(swingAnim.phase==='windup'||swingAnim.phase==='anticipation') sm = 0.5;
            else if(swingAnim.phase==='slash') sm = 0.65;
            else if(swingAnim.phase==='recover') sm = 0.8;
        }
        const immortalSpeedMult = player.immortalActive ? 2 : 1;
        if(dx!==0||dy!==0){
            player.x += dx*PLAYER_SPEED*player.speedMultiplier*sm*immortalSpeedMult;
            player.y += dy*PLAYER_SPEED*player.speedMultiplier*sm*immortalSpeedMult;
            if(!swingAnim.active) player.facing = Math.atan2(dy,dx);
        }
        player.x = Math.max(PLAYER_RADIUS, Math.min(WORLD_WIDTH-PLAYER_RADIUS, player.x));
        player.y = Math.max(PLAYER_RADIUS, Math.min(WORLD_HEIGHT-PLAYER_RADIUS, player.y));
        const {w,h} = getLogicalSize();
        cameraTarget.x = player.x - w/2;
        cameraTarget.y = player.y - h/2;
        camera.x += (cameraTarget.x-camera.x)*0.2;
        camera.y += (cameraTarget.y-camera.y)*0.2;
        clampCamera();
    }

    window.keyState = {w:false,a:false,s:false,d:false,up:false,down:false,left:false,right:false};

    // ========== 敌人更新 ==========
    function updateEnemies(){
        if(gameOver||isPaused) return;
        let playerSlowed = false, slowFactor = 1.0, tookDamageThisFrame = false;

        for(let i=0;i<enemies.length;i++){
            const e = enemies[i]; const type = e.type;
            if(e.attackTimer>0) e.attackTimer--;
            if(e.hitFlash>0) e.hitFlash--;
            if(e.spawnTimer>0) e.spawnTimer--;
            if(e.spawnPulse > 0) e.spawnPulse -= 0.04;
            if(e.maxShield>0 && e.shield<e.maxShield){
                e.shieldRegenTimer--;
                if(e.shieldRegenTimer<=0){ e.shield = Math.min(e.maxShield, e.shield+1); e.shieldRegenTimer = 80; }
            }
            if(type.phase){
                e.phaseTimer++;
                if(e.phaseTimer>=type.phaseInterval){ e.phaseTimer=0; e.phaseActive = !e.phaseActive; }
            }
            if(type.summoner){
                e.summonTimer--;
                if(e.summonTimer<=0 && enemies.length<MAX_ENEMIES-3){
                    e.summonTimer = type.summonCooldown;
                    for(let s=0;s<type.summonCount;s++){
                        const ang = Math.random()*Math.PI*2;
                        const dd = 60+Math.random()*40;
                        const sx = e.x+Math.cos(ang)*dd, sy = e.y+Math.sin(ang)*dd;
                        const st = ENEMY_TYPES[type.summonType];
                        if(!st) continue;
                        const hpMul = 1+Math.floor(kills/20)*0.45;
                        const hp = Math.ceil(st.healthBase*hpMul*0.5);
                        enemies.push({ x:Math.max(20,Math.min(WORLD_WIDTH-20,sx)), y:Math.max(20,Math.min(WORLD_HEIGHT-20,sy)),
                            attackTimer:0, radius:st.radius, health:hp, maxHealth:hp, hitFlash:0,
                            knockbackVX:0, knockbackVY:0, spawnTimer:20, typeKey:type.summonType, type:st,
                            weightClass:st.weightClass||'light', wobblePhase:Math.random()*Math.PI*2,
                            phaseTimer:0, phaseActive:false, summonTimer:0, shield:0, maxShield:0,
                            shieldRegenTimer:0, burnTimer:0, healTimer:0, stunTimer:0,
                            homeRunTimer:0, homeRunDamage:0, burnTimer2:0, burnDamage2:0, burnTick:0, spawnPulse:1.0 });
                    }
                    spawnParticles(e.x, e.y, 12, 180, 100, 200, 4, 4, 30, 0);
                }
            }
            if(type.healer){
                e.healTimer--;
                if(e.healTimer<=0){
                    e.healTimer = type.healInterval;
                    for(const other of enemies){
                        if(other===e || other.health>=other.maxHealth) continue;
                        const d = Math.hypot(other.x-e.x, other.y-e.y);
                        if(d<type.healRadius){
                            other.health = Math.min(other.maxHealth, other.health+type.healAmount);
                            spawnParticles(other.x, other.y, 3, 100, 255, 140, 2, 3, 20, 0);
                        }
                    }
                }
            }
            if(type.slowAura){
                const d = Math.hypot(player.x-e.x, player.y-e.y);
                if(d<type.slowRadius){ playerSlowed = true; slowFactor = Math.min(slowFactor, type.slowFactor); }
            }
            if(type.burnAura){
                const d = Math.hypot(player.x-e.x, player.y-e.y);
                if(d<type.burnRadius){
                    e.burnTimer--;
                    if(e.burnTimer<=0){
                        e.burnTimer = type.burnInterval;
                        if(player.invulnTimer<=0){
                            let bdmg = type.burnDamage;  // 已在类型定义中改为 0.75
                            if(player.immortalActive) bdmg = Math.max(0, Math.floor(bdmg * 0.1));
                            player.health -= bdmg;
                            player.invulnTimer = 20;
                            tookDamageThisFrame = true;
                            updateHUD();
                            if(bdmg > 0){
                                AudioEngine.play('player_hurt');
                                spawnFloatText(player.x, player.y-25, '-'+bdmg.toFixed(1), 255, 160, 60, 18);
                            }
                            if(player.health<=0){
                                player.health = 0; gameOver = true; updateHUD();
                                triggerShake(20,30);
                                spawnParticles(player.x, player.y, 25, 255, 120, 120, 5, 6, 50, 0);
                                spawnShockRing(player.x, player.y, 200, 255, 60, 60, 30, 5);
                            }
                        }
                    }
                }
            }
            if(e.burnTimer2 && e.burnTimer2 > 0){
                e.burnTimer2--;
                e.burnTick = (e.burnTick || 0) + 1;
                if(e.burnTick >= 60){
                    e.burnTick = 0;
                    e.health -= e.burnDamage2 || 1;
                    spawnParticles(e.x, e.y, 3, 255, 120, 40, 2, 3, 15, 0);
                    if(e.health <= 0){
                        enemyDeathExplosion(e);
                        enemies.splice(i,1);
                        kills++;
                        AudioEngine.play('kill_enemy');
                        player.exp += Math.floor(e.type.expValue * player.expMultiplier);
                        checkLevelUp();
                        continue;
                    }
                }
            }
            if(Math.abs(e.knockbackVX)>0.1 || Math.abs(e.knockbackVY)>0.1){
                e.x += e.knockbackVX; e.y += e.knockbackVY;
                e.knockbackVX *= 0.88; e.knockbackVY *= 0.88;
                if(e.homeRunTimer && e.homeRunTimer > 0){
                    e.homeRunTimer--;
                    for(let k=enemies.length-1; k>=0; k--){
                        const other = enemies[k];
                        if(other === e) continue;
                        if(other.homeRunTimer && other.homeRunTimer > 0) continue;
                        const d = Math.hypot(other.x-e.x, other.y-e.y);
                        if(d < e.radius + other.radius + 6){
                            const chainDmg = Math.max(1, Math.floor((e.homeRunDamage||3) * 0.6));
                            other.health -= chainDmg;
                            other.hitFlash = 6;
                            spawnFloatText(other.x, other.y-20, '-'+chainDmg, 255, 180, 60, 20);
                            spawnParticles(other.x, other.y, 6, 255, 200, 100, 4, 3, 20, 0);
                            triggerShake(5, 6);
                            const ang2 = Math.atan2(other.y-e.y, other.x-e.x);
                            other.knockbackVX = Math.cos(ang2) * 3;
                            other.knockbackVY = Math.sin(ang2) * 3;
                            if(other.health <= 0){
                                enemyDeathExplosion(other);
                                enemies.splice(k, 1);
                                kills++;
                                AudioEngine.play('kill_enemy');
                                if(player.lifesteal>0 && Math.random()<player.lifesteal){
                                    player.health = Math.min(player.maxHealth, player.health+1);
                                    updateHUD();
                                }
                                player.exp += Math.floor((other.type.expValue||1) * player.expMultiplier);
                                checkLevelUp();
                            }
                        }
                    }
                    if(e.homeRunTimer % 3 === 0){
                        spawnParticles(e.x, e.y, 2, 255, 220, 100, 2, 3, 15, 0);
                    }
                }
            }
            const dx = player.x-e.x, dy = player.y-e.y;
            const dist = Math.hypot(dx,dy);
            if(type.ranged){
                e.rangedAttackTimer--;
                if(e.rangedAttackTimer<=0 && dist<type.attackRange && !e.phaseActive){
                    e.rangedAttackTimer = type.attackCooldown;
                    const ang = Math.atan2(dy,dx);
                    spawnProjectile(e.x, e.y, ang, type.projectileSpeed, type.projectileDamage, type.coreColor.r, type.coreColor.g, type.coreColor.b, 5, 120);
                    spawnParticles(e.x, e.y, 4, type.color.r, type.color.g, type.color.b, 3, 3, 15, 0);
                }
                if(dist<type.keepDistance*0.7){ if(dist>1){ e.x -= dx/dist*type.speed*1.5; e.y -= dy/dist*type.speed*1.5; } }
                else if(dist>type.attackRange*1.1){ if(dist>1){ e.x += dx/dist*type.speed; e.y += dy/dist*type.speed; } }
            } else {
                if(e.stunTimer && e.stunTimer>0){
                    e.stunTimer--;
                    if(e.stunTimer % 6 === 0) spawnParticles(e.x, e.y, 2, 255, 255, 150, 2, 2, 15, 0);
                } else if(dist>1){
                    let speed = type.speed;
                    let moveX = dx/dist, moveY = dy/dist;
                    if(type.phase && e.phaseActive) speed *= 1.3;
                    if(e.typeKey==='swift'){
                        const wobble = Math.sin(frameCount*0.15+e.wobblePhase)*0.3;
                        const perpX = -dy/dist, perpY = dx/dist;
                        moveX += perpX*wobble; moveY += perpY*wobble;
                    }
                    if(e.typeKey==='bomber' && dist<type.chargeTriggerDist) speed *= type.chargeSpeedMult;
                    if(e.typeKey==='elite'){
                        const hr = e.health/e.maxHealth;
                        speed *= 1+(1-hr)*0.4;
                    }
                    if(e.typeKey==='splitter') speed *= 0.9;
                    const ml = Math.hypot(moveX,moveY);
                    if(ml>0.01){ e.x += (moveX/ml)*speed; e.y += (moveY/ml)*speed; }
                }
            }
            e.x = Math.max(type.radius, Math.min(WORLD_WIDTH-type.radius, e.x));
            e.y = Math.max(type.radius, Math.min(WORLD_HEIGHT-type.radius, e.y));
        }

        if(playerSlowed){
            player.speedMultiplier *= slowFactor;
            setTimeout(()=>{ player.speedMultiplier /= slowFactor; }, 100);
        }

        for(let i=enemies.length-1;i>=0;i--){
            const e = enemies[i]; const type = e.type;
            if(type.phase && e.phaseActive) continue;
            const dx = player.x-e.x, dy = player.y-e.y;
            const dist = Math.hypot(dx,dy);
            const cd = PLAYER_RADIUS+e.radius;
            if(dist<cd){
                let ang = dist>0.01?Math.atan2(dy,dx):Math.random()*Math.PI*2;
                const overlap = cd-dist;
                const ps = Math.max(overlap*1.5, 2);
                e.x -= Math.cos(ang)*ps; e.y -= Math.sin(ang)*ps;
                e.x = Math.max(type.radius, Math.min(WORLD_WIDTH-type.radius, e.x));
                e.y = Math.max(type.radius, Math.min(WORLD_HEIGHT-type.radius, e.y));
                if(e.attackTimer<=0){
                    e.attackTimer = ENEMY_ATTACK_COOLDOWN;
                    if(player.invulnTimer<=0){
                        if(e.shield>0){
                            e.shield--;
                            spawnParticles(e.x, e.y, 3, 150, 220, 255, 3, 3, 15, 1);
                            spawnFloatText(e.x, e.y-20, '护盾', 150, 220, 255, 16);
                        } else {
                            // 难度提升：不再减 1，直接用原伤害
                            let dmg = type.damage;
                            if(player.immortalActive) dmg = Math.max(0, Math.floor(dmg * 0.1));
                            player.health -= dmg;
                            player.invulnTimer = PLAYER_INVULN_FRAMES;
                            tookDamageThisFrame = true;
                            if(aiMode) aiState.panicTimer = 30;
                            updateHUD();
                            if(dmg > 0){
                                AudioEngine.play('player_hurt');
                                triggerShake(8,12);
                                spawnParticles(player.x, player.y, 6, 255, 60, 60, 3, 4, 25, 0);
                                spawnFloatText(player.x, player.y-30, '-'+dmg, 255, 80, 80, 22);
                            } else if (player.immortalActive) {
                                spawnFloatText(player.x, player.y-30, '仙体免伤', 200, 160, 255, 20);
                            }
                            if(player.health<=0){
                                player.health = 0; gameOver = true; updateHUD();
                                triggerShake(20,30);
                                spawnParticles(player.x, player.y, 25, 255, 120, 120, 5, 6, 50, 0);
                                spawnShockRing(player.x, player.y, 200, 255, 60, 60, 30, 5);
                                break;
                            }
                        }
                    }
                }
            }
        }
        if(player.invulnTimer>0) player.invulnTimer--;
        if(!gameOver && !isPaused){
            gameTime += 1/60;
            if(tookDamageThisFrame) noHitTimer = 0;
            else if(player.invulnTimer<=0) noHitTimer += 1/60;
            checkAchievements();
        }
    }

    // ========== 投射物 ==========
    function updateProjectiles(){
        for(let i=projectiles.length-1;i>=0;i--){
            const p = projectiles[i];
            p.x += p.vx; p.y += p.vy; p.life--;
            if(p.life<=0 || p.x<-50 || p.x>WORLD_WIDTH+50 || p.y<-50 || p.y>WORLD_HEIGHT+50){
                projectiles.splice(i,1); continue;
            }
            const dx = p.x-player.x, dy = p.y-player.y;
            const dist = Math.hypot(dx,dy);
            if(dist<PLAYER_RADIUS+p.radius){
                if(player.invulnTimer<=0){
                    let pdmg = p.damage;
                    if(player.immortalActive) pdmg = Math.max(0, Math.floor(pdmg * 0.1));
                    player.health -= pdmg;
                    player.invulnTimer = PLAYER_INVULN_FRAMES;
                    if(aiMode) aiState.panicTimer = 30;
                    updateHUD();
                    if(pdmg > 0){
                        AudioEngine.play('player_hurt');
                        triggerShake(6,10);
                        spawnParticles(player.x, player.y, 8, 255, 80, 80, 3, 4, 25, 0);
                        spawnFloatText(player.x, player.y-30, '-'+pdmg, 255, 80, 80, 22);
                    }
                    if(player.health<=0){
                        player.health = 0; gameOver = true; updateHUD();
                        triggerShake(20,30);
                        spawnParticles(player.x, player.y, 25, 255, 120, 120, 5, 6, 50, 0);
                        spawnShockRing(player.x, player.y, 200, 255, 60, 60, 30, 5);
                    }
                }
                projectiles.splice(i,1);
            }
        }
    }
    function spawnProjectile(x,y,angle,speed,damage,r,g,b,radius,life){
        if(projectiles.length>=MAX_PROJECTILES) return;
        projectiles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,damage,r,g,b,radius,life,maxLife:life});
    }

    // ========== 回旋镖 ==========
    function updateBoomerangs(){
        for(let i=boomerangs.length-1;i>=0;i--){
            const b = boomerangs[i];
            b.rotation += 0.4;
            if(b.phase==='out'){
                b.x += Math.cos(b.angle)*b.speed;
                b.y += Math.sin(b.angle)*b.speed;
                b.distance += b.speed;
                if(b.distance>=b.maxDistance) b.phase = 'back';
            } else {
                const dx = player.x-b.x, dy = player.y-b.y;
                const d = Math.hypot(dx,dy);
                if(d<15){ boomerangs.splice(i,1); continue; }
                b.x += (dx/d)*b.speed;
                b.y += (dy/d)*b.speed;
            }
            for(let j=enemies.length-1;j>=0;j--){
                const e = enemies[j];
                if(b.hitEnemies.has(e)) continue;
                if(Math.hypot(e.x-b.x, e.y-b.y) < e.radius+12){
                    b.hitEnemies.add(e);
                    const w = WEAPONS.boomerang;
                    let dmg = Math.floor(w.damage * player.damageMultiplier);
                    if(player.immortalActive) dmg = Math.floor(dmg * 5);
                    if(e.weightClass==='heavy') dmg += player.heavyBonus;
                    e.health -= dmg;
                    e.hitFlash = 6;
                    AudioEngine.play('hit_enemy');
                    spawnFloatText(e.x, e.y-20, '-'+dmg, 255, 200, 100, 20);
                    spawnParticles(e.x, e.y, 5, 255, 200, 100, 3, 3, 20, 0);
                    if(e.health<=0){
                        enemyDeathExplosion(e);
                        enemies.splice(j,1);
                        kills++;
                        AudioEngine.play('kill_enemy');
                        onMJKill();
                        if(player.lifesteal>0 && Math.random()<player.lifesteal){
                            player.health = Math.min(player.maxHealth, player.health+1);
                            updateHUD();
                        }
                        player.exp += Math.floor(e.type.expValue*player.expMultiplier);
                        checkLevelUp();
                    }
                }
            }
        }
    }

    // ========== 子弹 ==========
    function updateBullets(){
        for(let i=bullets.length-1; i>=0; i--){
            const b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            b.distance += Math.hypot(b.vx, b.vy);
            if(b.distance > b.maxDistance || b.x < -50 || b.x > WORLD_WIDTH+50 || b.y < -50 || b.y > WORLD_HEIGHT+50){
                bullets.splice(i,1); continue;
            }
            if(b.type === 'arrow' && frameCount % 2 === 0){
                spawnParticles(b.x, b.y, 1, 160, 240, 140, 1, 2, 12, 0, 0);
            } else if(b.type === 'bullet' && frameCount % 4 === 0){
                spawnParticles(b.x, b.y, 1, 255, 240, 180, 1, 1.5, 8, 0, 0);
            }
            for(let j=enemies.length-1; j>=0; j--){
                const e = enemies[j];
                if(b.hitEnemies.has(e)) continue;
                if(e.type.phase && e.phaseActive) continue;
                if(Math.hypot(e.x-b.x, e.y-b.y) < e.radius + 6){
                    b.hitEnemies.add(e);
                    let damage = Math.floor(b.damage * player.damageMultiplier);
                    if(player.immortalActive) damage = Math.floor(damage * 5);
                    if(e.weightClass === 'heavy') damage += player.heavyBonus;
                    e.health -= damage;
                    e.hitFlash = 6;
                    AudioEngine.play('hit_enemy');
                    const col = player.immortalActive ? {r:255,g:220,b:255} : (e.weightClass === 'heavy' && player.heavyBonus > 0 ? {r:245,g:200,b:66} : {r:255,g:229,b:102});
                    spawnFloatText(e.x, e.y-20, '-'+damage, col.r, col.g, col.b, 18+damage*2);
                    spawnParticles(e.x, e.y, 5, 255, 220, 100, 3, 3, 20, 0);
                    if(b.knockbackMult > 1){
                        const ang = Math.atan2(e.y-b.y, e.x-b.x);
                        const kb = b.knockbackMult * 2;
                        e.knockbackVX = Math.cos(ang)*kb;
                        e.knockbackVY = Math.sin(ang)*kb;
                    }
                    if(e.health <= 0){
                        enemyDeathExplosion(e);
                        enemies.splice(j,1);
                        kills++;
                        AudioEngine.play('kill_enemy');
                        onMJKill();
                        if(player.lifesteal>0 && Math.random()<player.lifesteal){
                            player.health = Math.min(player.maxHealth, player.health+1);
                            updateHUD();
                        }
                        player.exp += Math.floor(e.type.expValue * player.expMultiplier);
                        checkLevelUp();
                    }
                    b.pierce--;
                    if(b.pierce <= 0){ bullets.splice(i,1); break; }
                }
            }
        }
    }

    // ========== MJ形态 ==========
    function updateMJMode(){
        if(!MJ_MODE.enabled) return;
        MJ_MODE.beatTimer++;
        if(MJ_MODE.beatTimer>=MJ_MODE.beatInterval){ MJ_MODE.beatTimer = 0; spawnMJSparkle(); }
        MJ_MODE.moonwalkPhase += 0.15;
        const speed = Math.hypot(aiState.moveDir.x, aiState.moveDir.y);
        const targetTilt = speed>0.3?Math.min(35, speed*40):0;
        MJ_MODE.tiltAngle += (targetTilt-MJ_MODE.tiltAngle)*0.1;
        if(MJ_MODE.comboFade>0) MJ_MODE.spinPhase += 0.3;
        else MJ_MODE.spinPhase *= 0.95;
        MJ_MODE.poseTimer++;
        if(MJ_MODE.poseTimer>60){
            MJ_MODE.poseTimer = 0;
            if(aiState.displayMode==='flee'||aiState.displayMode==='retreat') MJ_MODE.currentPose = 'moonwalk';
            else if(aiState.displayMode==='attack') MJ_MODE.currentPose = 'kick';
            else if(aiState.lastDangerLevel>=2) MJ_MODE.currentPose = 'spin';
            else MJ_MODE.currentPose = 'tilt';
        }
        if(MJ_MODE.comboFade>0){
            MJ_MODE.comboFade -= 0.02;
            mjCombo.textContent = '×'+MJ_MODE.comboDisplay;
            mjCombo.classList.add('show');
            mjCombo.style.transform = `translateX(-50%) scale(${1+MJ_MODE.comboFade*0.5})`;
            mjCombo.style.opacity = MJ_MODE.comboFade;
        } else {
            mjCombo.classList.remove('show');
            MJ_MODE.comboDisplay = 0;
        }
        MJ_MODE.trailHistory.push({
            x:player.x, y:player.y, facing:player.facing, life:1.0,
            pose:MJ_MODE.currentPose, tilt:MJ_MODE.tiltAngle, spin:MJ_MODE.spinPhase
        });
        if(MJ_MODE.trailHistory.length>MJ_MODE.maxTrail) MJ_MODE.trailHistory.shift();
        for(let i=MJ_MODE.trailHistory.length-1;i>=0;i--){
            MJ_MODE.trailHistory[i].life -= 0.08;
            if(MJ_MODE.trailHistory[i].life<=0) MJ_MODE.trailHistory.splice(i,1);
        }
        for(let i=MJ_MODE.sparkles.length-1;i>=0;i--){
            const s = MJ_MODE.sparkles[i];
            s.life -= 0.05; s.x += s.vx; s.y += s.vy; s.vy += 0.05;
            if(s.life<=0) MJ_MODE.sparkles.splice(i,1);
        }
    }
    function spawnMJSparkle(){
        if(MJ_MODE.sparkles.length>=MJ_MODE.maxSparkles) return;
        const ang = Math.random()*Math.PI*2;
        const dd = 20+Math.random()*40;
        MJ_MODE.sparkles.push({
            x:player.x+Math.cos(ang)*dd, y:player.y+Math.sin(ang)*dd,
            vx:(Math.random()-0.5)*1.5, vy:-1-Math.random()*1.5,
            life:1.0, size:2+Math.random()*3,
            color: Math.random()<0.5?'#ffffff':'#ffcc00'
        });
    }
    function onMJKill(){
        if(!MJ_MODE.enabled) return;
        MJ_MODE.comboDisplay++;
        if(MJ_MODE.comboDisplay % 5 === 0) AudioEngine.play('combo', MJ_MODE.comboDisplay);
        MJ_MODE.comboFade = 1.0;
        MJ_MODE.spinPhase = Math.PI;
        for(let i=0;i<8;i++) spawnMJSparkle();
    }

    // ========== 普通AI ==========
    function updateAI(){
        if(gameOver||isPaused) return;
        updateMJMode();
        const {w,h} = getLogicalSize();
        const healthPercent = player.health/player.maxHealth;

        aiState.positionHistory.push({x:player.x, y:player.y});
        if(aiState.positionHistory.length>30) aiState.positionHistory.shift();

        const PREDICT_FRAMES = WINDUP_FRAMES + ANTICIPATION_FRAMES;

        const enemyInfos = [];
        let closestDist = Infinity, closestEnemy = null;
        let enemiesInDanger = 0, enemiesNear = 0, totalThreat = 0;
        let bomberNear = null, bomberDist = Infinity;

        const killReach = swordRange + 20;
        const halfArc = swordArc/2;

        for(const e of enemies){
            const dx = e.x-player.x, dy = e.y-player.y;
            const dist = Math.hypot(dx,dy);
            let tm = 1;
            if(e.typeKey==='swift') tm=1.5;
            else if(e.typeKey==='bomber') tm=2.0;
            else if(e.typeKey==='tank') tm=1.3;
            else if(e.typeKey==='elite') tm=1.8;
            else if(e.typeKey==='sniper') tm=1.6;
            else if(e.typeKey==='summoner') tm=2.2;
            else if(e.typeKey==='lava') tm=1.7;
            else if(e.typeKey==='frost') tm=1.4;
            if(e.weightClass==='heavy' && player.heavyBonus>0) tm *= 0.8;
            const threat = tm/(dist/100+0.5);
            totalThreat += threat;
            if(dist<100) enemiesInDanger++;
            if(dist<180) enemiesNear++;
            if(dist<closestDist){ closestDist = dist; closestEnemy = e; }
            if(e.typeKey==='bomber' && dist<bomberDist){ bomberDist = dist; bomberNear = e; }
            const enemyAngle = Math.atan2(dy,dx);
            let angleDiff = enemyAngle-player.facing;
            while(angleDiff>Math.PI) angleDiff-=Math.PI*2;
            while(angleDiff<-Math.PI) angleDiff+=Math.PI*2;
            const inArc = Math.abs(angleDiff)<halfArc*0.9;
            let predX = e.x, predY = e.y;
            if(dist>1){
                let speed = e.type.speed;
                if(e.typeKey==='bomber' && dist<e.type.chargeTriggerDist) speed *= e.type.chargeSpeedMult;
                if(e.typeKey==='elite'){
                    const hr = e.health/e.maxHealth;
                    speed *= 1+(1-hr)*0.4;
                }
                predX = e.x+(dx/dist)*speed*PREDICT_FRAMES;
                predY = e.y+(dy/dist)*speed*PREDICT_FRAMES;
            }
            const pdX = predX-player.x, pdY = predY-player.y;
            const predDist = Math.hypot(pdX,pdY);
            const predAngle = Math.atan2(pdY,pdX);
            let predDiff = predAngle-player.facing;
            while(predDiff>Math.PI) predDiff-=Math.PI*2;
            while(predDiff<-Math.PI) predDiff+=Math.PI*2;
            const predInArc = Math.abs(predDiff)<halfArc*0.85;
            const predInKill = predDist<killReach+e.radius && predInArc;
            let vs = 0;
            const canOneShot = e.health <= Math.floor(swordDamage*player.damageMultiplier)+(e.weightClass==='heavy'?player.heavyBonus:0);
            if(canOneShot) vs += 100;
            vs += (1-e.health/e.maxHealth)*60;
            vs += (e.type.expValue||1)*10;
            vs -= dist*0.15;
            if(predInKill) vs += 80;
            enemyInfos.push({ enemy:e, dist, inArc, predInArc, predInKill, predX, predY, predDist,
                healthRatio:e.health/e.maxHealth, angle:enemyAngle,
                inKillRange:dist<killReach+e.radius && inArc, valueScore:vs, threat,
                weightClass:e.weightClass });
        }

        let dangerLevel = 0;
        if(enemiesInDanger>=3||closestDist<42||totalThreat>15) dangerLevel = 3;
        else if(enemiesInDanger>=2||closestDist<65||totalThreat>8) dangerLevel = 2;
        else if(enemiesInDanger>=1 && healthPercent<0.6) dangerLevel = 2;
        else if(enemiesNear>=4 && healthPercent<0.5) dangerLevel = 2;
        else if(enemiesNear>=2||closestDist<120||totalThreat>4) dangerLevel = 1;
        if(healthPercent<=0.3 && dangerLevel<2) dangerLevel = 2;
        if(healthPercent<=0.15) dangerLevel = 3;
        if(aiState.panicTimer>0){
            aiState.panicTimer--;
            if(dangerLevel<1) dangerLevel = 1;
        }
        aiState.lastDangerLevel = dangerLevel;

        if(bomberNear && bomberDist<55){
            const dx = player.x-bomberNear.x, dy = player.y-bomberNear.y;
            const d = Math.hypot(dx,dy)||1;
            aiState.retreatTimer = 15;
            aiState.retreatDir = {x:dx/d, y:dy/d};
        }

        if(aiState.lockedTarget){
            if(!enemies.includes(aiState.lockedTarget)){ aiState.lockedTarget = null; aiState.lockTimer = 0; }
            else { aiState.lockTimer--; if(aiState.lockTimer<=0) aiState.lockedTarget = null; }
        }
        let target = null;
        if(aiState.lockedTarget && enemies.includes(aiState.lockedTarget)) target = aiState.lockedTarget;
        else {
            let bestScore = -Infinity;
            for(const info of enemyInfos){
                let score = info.valueScore;
                let nearby = 0;
                for(const other of enemies){
                    if(other===info.enemy) continue;
                    if(Math.hypot(other.x-info.enemy.x, other.y-info.enemy.y)<140) nearby++;
                }
                score -= nearby*8;
                score += info.threat*5;
                if(score>bestScore){ bestScore = score; target = info.enemy; }
            }
            if(target){ aiState.lockedTarget = target; aiState.lockTimer = 180; }
        }

        const killRange = enemyInfos.filter(i=>i.predInKill).sort((a,b)=>{
            if(a.enemy.typeKey==='bomber' && b.enemy.typeKey!=='bomber') return -1;
            if(b.enemy.typeKey==='bomber' && a.enemy.typeKey!=='bomber') return 1;
            return a.dist-b.dist;
        });
        const isSwinging = swingAnim.active;
        if(killRange.length>0 && !isSwinging && swordCooldown<=0 && aiState.retreatTimer<=0){
            let attackGap;
            if(dangerLevel>=2) attackGap = 6;
            else if(dangerLevel===1) attackGap = 8;
            else attackGap = 5;
            if(frameCount-aiState.lastAttackFrame > attackGap){
                const tgt = killRange[0].enemy;
                const dx = tgt.x-player.x, dy = tgt.y-player.y;
                player.facing = Math.atan2(dy,dx);
                if(trySwordAttack()){
                    aiState.lastAttackFrame = frameCount;
                    const d = Math.hypot(dx,dy)||1;
                    aiState.retreatTimer = 10;
                    aiState.retreatDir = {x:-dx/d, y:-dy/d};
                }
            }
        }

        let moveX = 0, moveY = 0;
        let newMode = aiState.displayMode;
        if(isSwinging){
            moveX = aiState.moveDir.x; moveY = aiState.moveDir.y; newMode = 'attack';
        } else if(aiState.retreatTimer>0){
            aiState.retreatTimer--;
            moveX = aiState.retreatDir.x; moveY = aiState.retreatDir.y; newMode = 'retreat';
        } else if(dangerLevel>=2){
            const safe = findSafestDirection(enemyInfos, 160);
            moveX = safe.x; moveY = safe.y; newMode = 'flee';
        } else if(dangerLevel===1){
            if(target){
                const dx = target.x-player.x, dy = target.y-player.y;
                const dist = Math.hypot(dx,dy)||1;
                if(!killRange.length) player.facing = Math.atan2(dy,dx);
                const ideal = swordRange*0.85;
                if(dist<ideal*0.7){ moveX -= dx/dist*0.8; moveY -= dy/dist*0.8; }
                else if(dist>ideal*1.4){ moveX += dx/dist*0.3; moveY += dy/dist*0.3; }
                aiState.strafeTimer++;
